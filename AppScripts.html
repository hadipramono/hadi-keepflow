<!-- Main frontend application script. Included by Index.html. -->
  <script>
    // Hadi KeepFlow v1.3.0 — Phase 3.1 Data Portability & Backup
    let notes = [];
    let currentFilter = 'all';
    let currentCategory = null;
    let currentTag = null;
    let searchQuery = '';
    let isListView = false;
    let activeNoteId = null;
    let searchRenderTimer = null;
    const SEARCH_DEBOUNCE_MS = 120;
    const plainTextCache = new WeakMap();
    const DRAFT_KEY = 'hadi_keepflow_editor_draft_v1';
    const DRAFT_AUTOSAVE_MS = 650;
    let draftSaveTimer = null;
    let editorBaseline = null;
    let editorDraftDirty = false;
    
    let datePreset = 'all';
    let customStartDate = null;
    let customEndDate = null;

    const LOCAL_KEY = 'hadi_keepflow_offline_notes_v1';
    const CATEGORY_STATE_KEY = 'hadi_keepflow_categories_v1';
    const DEFAULT_CATEGORIES = ['Umum'];
    let categories = [...DEFAULT_CATEGORIES];
    let pendingCategoryCreates = [];

    function loadCategoryState() {
      try {
        const state = JSON.parse(localStorage.getItem(CATEGORY_STATE_KEY) || '{}');
        categories = [...new Set([...DEFAULT_CATEGORIES, ...(Array.isArray(state.categories) ? state.categories : [])])];
        pendingCategoryCreates = Array.isArray(state.pendingCreates) ? state.pendingCreates.filter(name => typeof name === 'string') : [];
      } catch (error) {
        categories = [...DEFAULT_CATEGORIES];
        pendingCategoryCreates = [];
      }
    }

    function pruneLegacyDefaultCategoriesFromLocalState() {
      const legacyDefaults = new Set(['Pekerjaan', 'Pribadi']);
      const noteCategories = new Set(notes.map(note => String(note.category || 'Umum').trim()));
      categories = categories.filter(category =>
        !legacyDefaults.has(category) || noteCategories.has(category) || pendingCategoryCreates.includes(category)
      );
      persistCategoryState();
    }

    function persistCategoryState() {
      try {
        localStorage.setItem(CATEGORY_STATE_KEY, JSON.stringify({ categories, pendingCreates: pendingCategoryCreates }));
      } catch (error) {
        console.error('KeepFlow category persistence error:', error);
      }
    }

    function mergeCategories(names) {
      if (!Array.isArray(names)) return;
      categories = [...new Set([...DEFAULT_CATEGORIES, ...categories, ...names.map(name => String(name).trim()).filter(Boolean)])];
      persistCategoryState();
      renderCategories();
    }

    function reconcileCloudCategories(names) {
      if (!Array.isArray(names)) return;
      const noteCategories = notes.map(note => String(note.category || 'Umum').trim()).filter(Boolean);
      categories = [...new Set([
        ...DEFAULT_CATEGORIES,
        ...names.map(name => String(name).trim()).filter(Boolean),
        ...noteCategories,
        ...pendingCategoryCreates
      ])];
      persistCategoryState();
      renderCategories();
    }

    function syncPendingCategoryCreates() {
      if (!pendingCategoryCreates.length || !navigator.onLine ||
          typeof google === 'undefined' || !google.script || !google.script.run) return;
      const category = pendingCategoryCreates[0];
      google.script.run
        .withSuccessHandler(response => {
          if (!response || response.status !== 'success') {
            setSyncStatus((response && response.message) || 'Kategori belum tersimpan di cloud', 'fa-triangle-exclamation', 'text-amber-500');
            return;
          }
          pendingCategoryCreates = pendingCategoryCreates.filter(name => name !== category);
          reconcileCloudCategories(response.categories || [response.category]);
          persistCategoryState();
          if (pendingCategoryCreates.length) syncPendingCategoryCreates();
        })
        .withFailureHandler(error => {
          console.error('KeepFlow create category error:', error);
          setSyncStatus('Gagal menyimpan kategori - akan dicoba lagi saat online', 'fa-triangle-exclamation', 'text-amber-500');
        })
        .createCategoryFolder(category);
    }

    function refreshCloudCategories() {
      if (!navigator.onLine || typeof google === 'undefined' || !google.script || !google.script.run) return;
      google.script.run
        .withSuccessHandler(names => {
          reconcileCloudCategories(names);
          syncPendingCategoryCreates();
        })
        .withFailureHandler(error => {
          console.warn('KeepFlow category load failed:', error);
          syncPendingCategoryCreates();
        })
        .getCategories();
    }

    function addCategory(categoryName) {
      const name = String(categoryName || '').replace(/[\/\\?%*:|"<>]/g, '-').replace(/\s+/g, ' ').trim().slice(0, 120);
      if (!name) return;
      if (name.toLocaleLowerCase() === 'umum') {
        currentCategory = 'Umum';
        currentFilter = 'category';
        currentTag = null;
        render();
        return;
      }
      const existing = categories.find(item => item.toLowerCase() === name.toLowerCase());
      const finalName = existing || name;
      mergeCategories([finalName]);
      currentCategory = finalName;
      currentFilter = 'category';
      currentTag = null;
      if (!pendingCategoryCreates.includes(finalName)) pendingCategoryCreates.push(finalName);
      persistCategoryState();
      render();
      syncPendingCategoryCreates();
    }

    function updateToolbarState() {
      document.querySelectorAll('.toolbar-btn').forEach(btn => {
        const cmd = btn.getAttribute('data-command');
        const val = btn.getAttribute('data-value');
        let active = false;
        try {
          if (cmd === 'formatBlock') {
            active = document.queryCommandValue(cmd).toLowerCase() === val.replace(/<|>/g, '').toLowerCase();
          } else {
            active = document.queryCommandState(cmd);
          }
        } catch (e) {}
        if (active) btn.classList.add('active');
        else btn.classList.remove('active');
      });
    }

    document.querySelectorAll('.toolbar-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        const cmd = this.getAttribute('data-command');
        const val = this.getAttribute('data-value') || null;
        document.execCommand(cmd, false, val);
        document.getElementById('editor-content-editable').focus();
        updateToolbarState();
      });
    });

    const editableArea = document.getElementById('editor-content-editable');
    if (editableArea) {
      editableArea.addEventListener('keyup', updateToolbarState);
      editableArea.addEventListener('mouseup', updateToolbarState);
      editableArea.addEventListener('focus', updateToolbarState);
    }

    function formatDate(isoString) {
      if (!isoString) return '-';
      const date = new Date(isoString);
      return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function showLoader(message) {
      const loader = document.getElementById('global-loader');
      const text = document.getElementById('loader-text');
      if (text) text.textContent = message || 'Memproses...';
      if (loader) loader.classList.remove('opacity-0', 'pointer-events-none');
    }

    function hideLoader() {
      const loader = document.getElementById('global-loader');
      if (loader) loader.classList.add('opacity-0', 'pointer-events-none');
    }

    const QUEUE_KEY = 'hadi_keepflow_pending_v1';
    let pendingOperations = [];
    let syncRunning = false;
    let inFlightOperationId = null;
    let serverReady = false;
    let queueInitialized = false;
    let cloudLoadInProgress = false;
    let cloudLoadRequestId = 0;
    let refreshRequested = false;
    let retryTimer = null;
    const MAX_AUTO_RETRIES = 10;
    const MAX_RETRY_DELAY_MS = 5 * 60 * 1000;
    // Snapshot of the last UI state observed by syncToBackend().
    // This is deliberately separate from the last server response.
    let lastObservedNotes = [];

    function cloneData(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function createOperationId() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }
      return 'op_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    }

    function readQueue() {
      try {
        const value = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
        if (!Array.isArray(value)) {
          pendingOperations = [];
          return;
        }

        // Migrate the v1 queue format without discarding valid pending work.
        pendingOperations = value
          .filter(op => op && (op.type === 'save' || op.type === 'delete'))
          .map(op => {
            const id = String(op.id || (op.note && op.note.id) || '');
            if (!id) return null;
            const normalized = {
              opId: op.opId || createOperationId(),
              type: op.type,
              id,
              queuedAt: op.queuedAt || new Date().toISOString(),
              attempts: Number(op.attempts) || 0,
              nextAttemptAt: op.nextAttemptAt || '',
              lastError: op.lastError || '',
              expectedUpdatedAt: op.expectedUpdatedAt || ''
            };
            if (op.conflict) normalized.conflict = op.conflict;
            if (op.type === 'save') {
              if (!op.note || typeof op.note !== 'object') return null;
              normalized.note = { ...op.note, id };
            }
            return normalized;
          })
          .filter(Boolean);
      } catch (e) {
        console.error('KeepFlow queue read error:', e);
        pendingOperations = [];
      }
    }

    function persistLocal() {
      let queueSaved = false;
      try {
        // Persist the queue first: it is the recovery log for cloud operations.
        localStorage.setItem(QUEUE_KEY, JSON.stringify(pendingOperations));
        queueSaved = true;
      } catch (e) {
        console.error('KeepFlow queue persistence error:', e);
        setSyncStatus('Gagal menyimpan antrean lokal', 'fa-triangle-exclamation', 'text-red-500');
      }

      updateQueueIndicator();
      try {
        localStorage.setItem(LOCAL_KEY, JSON.stringify(notes));
      } catch (e) {
        console.error('KeepFlow local data persistence error:', e);
        setSyncStatus('Data terlalu besar untuk disimpan lokal', 'fa-triangle-exclamation', 'text-red-500');
      }
      return queueSaved;
    }

    function setSyncStatus(message, icon = 'fa-cloud', color = 'text-gray-400') {
      const el = document.getElementById('sync-status');
      if (el) {
        el.innerHTML = `<i class="fa-solid ${icon} ${color}"></i><span class="truncate">${escapeHTML(message)}</span>`;
        el.title = message;
      }
      updateQueueIndicator();
    }

    function updateQueueIndicator() {
      const indicator = document.getElementById('sync-queue-count');
      if (!indicator) return;
      const count = pendingOperations.length;
      indicator.textContent = `${count} tertunda`;
      indicator.classList.toggle('hidden', count === 0);
    }

    function showManualRetry(show) {
      const button = document.getElementById('retry-sync');
      if (button) button.classList.toggle('hidden', !show);
    }

    function clearRetryTimer() {
      if (retryTimer !== null) {
        clearTimeout(retryTimer);
        retryTimer = null;
      }
    }

    function getRetryDelay(attempts) {
      const base = Math.min(1000 * Math.pow(2, Math.max(0, attempts - 1)), MAX_RETRY_DELAY_MS);
      // Small jitter prevents synchronized retries across tabs/devices.
      return Math.round(base * (0.8 + Math.random() * 0.4));
    }

    function schedulePendingRetry() {
      clearRetryTimer();
      if (!pendingOperations.length || !navigator.onLine || !serverReady) return;
      const head = pendingOperations[0];
      if ((Number(head.attempts) || 0) >= MAX_AUTO_RETRIES) {
        showManualRetry(true);
        setSyncStatus(`Antrean tertahan setelah ${MAX_AUTO_RETRIES} percobaan. Periksa koneksi lalu coba lagi.`, 'fa-triangle-exclamation', 'text-amber-500');
        return;
      }
      const dueAt = head.nextAttemptAt ? new Date(head.nextAttemptAt).getTime() : Date.now();
      const waitMs = Math.max(0, dueAt - Date.now());
      showManualRetry(false);
      if (waitMs === 0) {
        flushPendingOperations();
        return;
      }
      setSyncStatus(`Sinkronisasi dicoba lagi dalam ${Math.ceil(waitMs / 1000)} detik`, 'fa-clock', 'text-amber-500');
      retryTimer = setTimeout(() => {
        retryTimer = null;
        flushPendingOperations();
      }, Math.min(waitMs, MAX_RETRY_DELAY_MS));
    }

    function recordOperationFailure(operation, error) {
      const failed = pendingOperations.find(op => op.opId === operation.opId);
      if (!failed) return;
      failed.attempts = (Number(failed.attempts) || 0) + 1;
      failed.lastError = String(error && (error.message || error) || 'Kesalahan tidak diketahui').slice(0, 300);
      if (failed.attempts < MAX_AUTO_RETRIES) {
        failed.nextAttemptAt = new Date(Date.now() + getRetryDelay(failed.attempts)).toISOString();
      } else {
        failed.nextAttemptAt = '';
      }
      persistLocal();
      schedulePendingRetry();
    }

    function enqueueOperation(type, noteOrId) {
      const id = type === 'delete'
        ? String(typeof noteOrId === 'object' ? noteOrId.id : noteOrId)
        : String(noteOrId.id);
      if (!id) return;

      const operation = type === 'delete'
        ? {
            opId: createOperationId(),
            type: 'delete',
            id,
            queuedAt: new Date().toISOString(),
            attempts: 0,
            expectedUpdatedAt: typeof noteOrId === 'object' ? (noteOrId.baseUpdatedAt || '') : ''
          }
        : {
            opId: createOperationId(),
            type: 'save',
            id,
            // Snapshot is immutable after enqueue; later edits create a new operation.
            note: cloneData({ ...noteOrId, id }),
            queuedAt: new Date().toISOString(),
            attempts: 0
          };

      // Keep the in-flight head untouched. Coalesce only operations that have
      // not been sent yet, so the latest pending action for this note wins.
      pendingOperations = pendingOperations.filter(op =>
        op.opId === inFlightOperationId || String(op.id) !== id
      );
      pendingOperations.push(operation);

      if (persistLocal()) flushPendingOperations();
    }

    function replaceTemporaryId(oldId, savedNote, acknowledgedOperationId) {
      const oldKey = String(oldId);
      const newKey = String(savedNote.id);

      // Advance the cloud baseline and replace temporary identity when needed.
      // Preserve current local fields because the user may have edited meanwhile.
      notes = notes.map(note =>
        String(note.id) === oldKey
          ? { ...note, id: newKey, baseUpdatedAt: savedNote.baseUpdatedAt || savedNote.updatedAt }
          : note
      );

      lastObservedNotes = lastObservedNotes.map(note =>
        String(note.id) === oldKey
          ? { ...note, id: newKey, baseUpdatedAt: savedNote.baseUpdatedAt || savedNote.updatedAt }
          : note
      );

      // Advance the baseline for later queued operations on the same note.
      // Preserve each operation's content snapshot; update only its identity/version.
      pendingOperations = pendingOperations.map(op => {
        if (op.opId === acknowledgedOperationId || String(op.id) !== oldKey) return op;
        if (op.type === 'delete') {
          return { ...op, id: newKey, expectedUpdatedAt: savedNote.baseUpdatedAt || savedNote.updatedAt };
        }
        return {
          ...op,
          id: newKey,
          note: { ...op.note, id: newKey, baseUpdatedAt: savedNote.baseUpdatedAt || savedNote.updatedAt }
        };
      });

      persistLocal();
      render();
    }

    function resolveSyncConflict(operation, response) {
      const currentNote = response.currentNote || null;
      const id = String(operation.id);
      const message = currentNote
        ? 'Versi catatan di Google Drive berbeda dari versi lokal.\n\n' +
          'OK: pertahankan versi lokal dan timpa versi cloud (keputusan manual).\n' +
          'Cancel: buang perubahan lokal tertunda dan gunakan versi cloud.'
        : operation.type === 'save'
          ? 'Catatan yang menjadi dasar perubahan sudah tidak ada atau tidak dapat diakses di Google Drive.\n\n' +
            'OK: simpan salinan lokal sebagai catatan baru.\n' +
            'Cancel: buang perubahan lokal tertunda.'
          : 'Catatan sudah tidak ditemukan di Google Drive. Penghapusan dianggap selesai.';
      const keepLocal = confirm(message);

      if (keepLocal) {
        if (currentNote) {
          pendingOperations = pendingOperations.map(op => {
            if (String(op.id) !== id) return op;
            const next = { ...op, conflict: null, attempts: 0 };
            if (next.type === 'save') {
              next.note = { ...next.note, baseUpdatedAt: currentNote.baseUpdatedAt };
            } else {
              next.expectedUpdatedAt = currentNote.baseUpdatedAt;
            }
            return next;
          });
          notes = notes.map(note => String(note.id) === id
            ? { ...note, baseUpdatedAt: currentNote.baseUpdatedAt }
            : note);
          lastObservedNotes = lastObservedNotes.map(note => String(note.id) === id
            ? { ...note, baseUpdatedAt: currentNote.baseUpdatedAt }
            : note);
        } else {
          // The cloud copy disappeared. Recreate a local save under a new ID;
          // a pending delete is already satisfied by the missing cloud file.
          const localNote = notes.find(note => String(note.id) === id);
          pendingOperations = pendingOperations.filter(op => String(op.id) !== id);
          if (operation.type === 'save' && localNote) {
            const newId = 'temp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
            const recreated = { ...localNote, id: newId, baseUpdatedAt: undefined };
            notes = notes.map(note => String(note.id) === id ? recreated : note);
            lastObservedNotes = lastObservedNotes.filter(note => String(note.id) !== id);
            enqueueOperation('save', recreated);
          }
        }
        setSyncStatus('Konflik: versi lokal dipilih secara manual', 'fa-triangle-exclamation', 'text-amber-500');
      } else {
        pendingOperations = pendingOperations.filter(op => String(op.id) !== id);
        if (currentNote) {
          notes = notes.map(note => String(note.id) === id ? currentNote : note);
          if (!notes.some(note => String(note.id) === id)) notes.push(currentNote);
          lastObservedNotes = lastObservedNotes.map(note => String(note.id) === id ? currentNote : note);
          if (!lastObservedNotes.some(note => String(note.id) === id)) lastObservedNotes.push(currentNote);
        } else {
          notes = notes.filter(note => String(note.id) !== id);
          lastObservedNotes = lastObservedNotes.filter(note => String(note.id) !== id);
        }
        setSyncStatus('Konflik diselesaikan: menggunakan versi cloud', 'fa-cloud', 'text-green-600');
      }

      persistLocal();
      render();
    }

    function flushPendingOperations() {
      if (syncRunning) return;

      if (cloudLoadInProgress) {
        setSyncStatus('Memperbarui data cloud sebelum sinkronisasi...', 'fa-circle-notch fa-spin', 'text-blue-500');
        return;
      }

      if (!navigator.onLine) {
        setSyncStatus('Offline - perubahan masuk antrean', 'fa-triangle-exclamation', 'text-amber-500');
        return;
      }

      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        setSyncStatus('Mode lokal - Google Apps Script tidak tersedia', 'fa-database', 'text-blue-500');
        return;
      }

      // Wait until the initial cloud snapshot has completed. Operations may be
      // queued before this point, but must not race the initial reconciliation.
      if (!serverReady) {
        setSyncStatus('Antrean tersimpan - menunggu data cloud', 'fa-database', 'text-blue-500');
        return;
      }

      if (!pendingOperations.length) {
        clearRetryTimer();
        showManualRetry(false);
        setSyncStatus('Tersinkron dengan Google Drive', 'fa-cloud', 'text-green-500');
        return;
      }

      const head = pendingOperations[0];
      if ((Number(head.attempts) || 0) >= MAX_AUTO_RETRIES) {
        showManualRetry(true);
        setSyncStatus(`Antrean tertahan setelah ${MAX_AUTO_RETRIES} percobaan. Periksa koneksi lalu coba lagi.`, 'fa-triangle-exclamation', 'text-amber-500');
        return;
      }
      if (head.nextAttemptAt && new Date(head.nextAttemptAt).getTime() > Date.now()) {
        schedulePendingRetry();
        return;
      }
      clearRetryTimer();
      showManualRetry(false);
      const queuedHead = pendingOperations[0];
      const operation = cloneData(queuedHead);
      syncRunning = true;
      inFlightOperationId = operation.opId;
      setSyncStatus('Menyinkronkan perubahan...', 'fa-circle-notch fa-spin', 'text-blue-500');

      const runner = google.script.run
        .withSuccessHandler(response => {
          if (response && response.status === 'conflict') {
            syncRunning = false;
            inFlightOperationId = null;
            resolveSyncConflict(operation, response);
            flushPendingOperations();
            return;
          }

          const validSaveResponse = operation.type !== 'save' ||
            (response && response.note && response.note.id);
          if (!response || response.status !== 'success' || !validSaveResponse) {
            syncRunning = false;
            inFlightOperationId = null;
            recordOperationFailure(operation, 'Respons server tidak valid atau operasi gagal.');
            if (refreshRequested) {
              refreshRequested = false;
              loadInitialData();
            }
            return;
          }

          if (operation.type === 'save' && response.note && response.note.id) {
            replaceTemporaryId(operation.id, response.note, operation.opId);
          } else if (operation.type === 'delete') {
            // The local delete already happened. Keep this defensive cleanup
            // for operations restored from an older queue.
            notes = notes.filter(note => String(note.id) !== String(operation.id));
            lastObservedNotes = lastObservedNotes.filter(note => String(note.id) !== String(operation.id));
          }

          // Acknowledge by operation ID, never by blindly shifting the queue.
          pendingOperations = pendingOperations.filter(op => op.opId !== operation.opId);
          persistLocal();
          clearRetryTimer();

          syncRunning = false;
          inFlightOperationId = null;
          render();
          if (refreshRequested) {
            refreshRequested = false;
            loadInitialData();
          } else {
            flushPendingOperations();
          }
        })
        .withFailureHandler(error => {
          syncRunning = false;
          inFlightOperationId = null;
          recordOperationFailure(operation, error);
          console.error('KeepFlow sync error:', error);
          if (refreshRequested) {
            refreshRequested = false;
            loadInitialData();
          }
        });

      if (operation.type === 'delete') runner.deleteNote(operation.id, operation.expectedUpdatedAt, operation.opId);
      else runner.saveNote(operation.note, operation.opId);
    }

    function loadInitialData() {
      loadCategoryState();
      // Never reconcile a cloud snapshot while a write is in flight. The
      // snapshot could predate that write and reintroduce stale data.
      if (syncRunning) {
        refreshRequested = true;
        return;
      }
      if (cloudLoadInProgress) {
        refreshRequested = true;
        return;
      }

      showLoader(serverReady ? 'Memperbarui data Hadi KeepFlow...' : 'Memuat data Hadi KeepFlow...');
      if (!queueInitialized) {
        readQueue();
        queueInitialized = true;
      }

      try {
        const localData = JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]');
        notes = Array.isArray(localData) ? localData : [];
      } catch (e) {
        notes = [];
      }
      pruneLegacyDefaultCategoriesFromLocalState();

      // Capture local state before the request. Any edits/deletes made while
      // the request is pending are recorded in the durable queue by
      // syncToBackend() and are applied over the returned cloud baseline.
      lastObservedNotes = cloneData(notes);
      render();
      hideLoader();

      if (!navigator.onLine || typeof google === 'undefined' || !google.script || !google.script.run) {
        serverReady = false;
        setSyncStatus('Mode lokal - menunggu koneksi', 'fa-database', 'text-blue-500');
        return;
      }

      const wasServerReady = serverReady;
      serverReady = false;
      cloudLoadInProgress = true;
      const requestId = ++cloudLoadRequestId;

      google.script.run
        .withSuccessHandler(serverData => {
          if (requestId !== cloudLoadRequestId) return;
          cloudLoadInProgress = false;

          if (!Array.isArray(serverData)) {
            serverReady = wasServerReady;
            setSyncStatus('Respons server tidak valid - data lokal dipertahankan', 'fa-triangle-exclamation', 'text-amber-500');
            if (refreshRequested) {
              refreshRequested = false;
              loadInitialData();
            } else if (serverReady) {
              flushPendingOperations();
            }
            return;
          }

          serverReady = true;
          // Cloud is the baseline. Preserve local notes with pending saves,
          // and apply queued deletes as tombstones so they cannot reappear.
          const queuedSaves = new Set(pendingOperations
            .filter(op => op.type === 'save')
            .map(op => String(op.id)));
          const queuedDeletes = new Set(pendingOperations
            .filter(op => op.type === 'delete')
            .map(op => String(op.id)));
          const localPending = notes.filter(note => queuedSaves.has(String(note.id)));
          const merged = new Map(serverData.map(note => [String(note.id), note]));
          localPending.forEach(note => merged.set(String(note.id), note));

          notes = [...merged.values()].filter(note => !queuedDeletes.has(String(note.id)));

          // Do not treat the server response as a user edit. Pending operations
          // remain the authoritative record of local changes until acknowledged.
          lastObservedNotes = cloneData(notes);
          persistLocal();
          render();
          refreshCloudCategories();

          if (refreshRequested) {
            refreshRequested = false;
            loadInitialData();
          } else {
            flushPendingOperations();
          }
        })
        .withFailureHandler(error => {
          if (requestId !== cloudLoadRequestId) return;
          cloudLoadInProgress = false;
          serverReady = wasServerReady;
          console.error('KeepFlow load error:', error);
          setSyncStatus('Gagal memuat cloud - data lokal dipertahankan', 'fa-triangle-exclamation', 'text-amber-500');
          if (refreshRequested) {
            refreshRequested = false;
            loadInitialData();
          } else if (serverReady) {
            flushPendingOperations();
          }
        })
        .getNotes();
    }

    // Backward-compatible entry point used by existing UI actions.
    // It records deltas against the last observed UI snapshot, even while the
    // initial cloud request is still loading. The queue itself is durable.
    function syncToBackend() {
      const current = cloneData(notes);
      const currentMap = new Map(current.map(note => [String(note.id), note]));
      const previousMap = new Map(lastObservedNotes.map(note => [String(note.id), note]));

      current.forEach(note => {
        const old = previousMap.get(String(note.id));
        if (!old || JSON.stringify(old) !== JSON.stringify(note)) {
          enqueueOperation('save', note);
        }
      });

      lastObservedNotes.forEach(old => {
        if (!currentMap.has(String(old.id))) enqueueOperation('delete', old);
      });

      lastObservedNotes = current;
      persistLocal();
      flushPendingOperations();
    }

      const deleteButton = event.target.closest('.delete-category-btn');

        const count = notes.filter(note => (note.category || 'Umum') === category).length;
        if (count > 0) {
          alert(`Kategori "${category}" masih memiliki ${count} catatan. Hapus atau pindahkan catatan terlebih dahulu.`);

        }
        if (!navigator.onLine || typeof google === 'undefined' || !google.script || !google.script.run) {
          alert('Penghapusan kategori memerlukan koneksi internet. Silakan coba kembali saat online.');
          return;
        }
        if (!confirm(`Hapus kategori kosong "${category}"? Tindakan ini memindahkan folder kategori ke Sampah Google Drive.`)) return;
        deleteButton.disabled = true;
        google.script.run
          .withSuccessHandler(response => {
            if (!response || response.status !== 'success') {
              alert((response && response.message) || 'Kategori gagal dihapus.');
              renderCategories();
              return;

            categories = categories.filter(item => item !== category);

    function getPlainText(note) {
      if (!note || typeof note !== 'object') return '';
      const source = typeof note.content === 'string' ? note.content : '';
      const cached = plainTextCache.get(note);
      if (cached && cached.source === source) return cached.text;

      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = source;
      const text = tempDiv.textContent || tempDiv.innerText || '';
      plainTextCache.set(note, { source, text, lower: text.toLowerCase() });
      return text;
    }

    function getSearchableText(note) {
      const source = typeof note.content === 'string' ? note.content : '';
      const cached = plainTextCache.get(note);
      if (cached && cached.source === source) return cached;
      getPlainText(note);
      return plainTextCache.get(note);
    }

    function matchesDateFilter(noteDateStr) {
      if (datePreset === 'all') return true;
      if (!noteDateStr) return false;
      const noteDate = new Date(noteDateStr);
      noteDate.setHours(0, 0, 0, 0);
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      if (datePreset === 'today') return noteDate.getTime() === today.getTime();
      if (datePreset === '7days') {
        const limit = new Date(today);
        limit.setDate(limit.getDate() - 7);
        return noteDate >= limit && noteDate <= today;
      }
      if (datePreset === '30days') {
        const limit = new Date(today);
        limit.setDate(limit.getDate() - 30);
        return noteDate >= limit && noteDate <= today;
      }
      if (datePreset === 'custom') {
        if (!customStartDate && !customEndDate) return true;
        const start = customStartDate ? new Date(customStartDate) : new Date(0);
        start.setHours(0, 0, 0, 0);
        const end = customEndDate ? new Date(customEndDate) : new Date();
        end.setHours(23, 59, 59, 999);
        return noteDate >= start && noteDate <= end;
      }
      return true;
    }

    function getFilteredNotes() {
      const query = searchQuery.toLowerCase().trim();
      return notes.filter(note => {
        if (query) {
          const title = String(note.title || '').toLowerCase();
          const searchable = getSearchableText(note);
          if (!title.includes(query) && !searchable.lower.includes(query)) return false;
        }

        if (!matchesDateFilter(note.updatedAt)) return false;
        if (currentFilter === 'pinned') return note.isPinned && !isArchivedNote(note);
        if (currentFilter === 'archive') return isArchivedNote(note);
        if (currentCategory) return (note.category || 'Umum') === currentCategory && !isArchivedNote(note);
        if (currentTag) return note.tags && note.tags.includes(currentTag) && !isArchivedNote(note);
        return !isArchivedNote(note);
      });
    }

    function render() {
      const filtered = getFilteredNotes();
      updateActiveView(filtered.length);
      notesGrid.className = isListView ? 'view-list' : 'view-grid';
      pinnedGrid.className = isListView ? 'view-list' : 'view-grid';
      
      if (currentFilter === 'pinned') {
        // Dedicated pinned view: show only pinned, non-archived notes.
        pinnedSection.classList.add('hidden');
        othersTitle.classList.add('hidden');
        notesGrid.innerHTML = filtered.map(createCardHTML).join('');
      } else if (currentCategory || currentTag) {
        // Category/tag views must include BOTH pinned and regular notes.
        // Pinning only changes grouping in the All Notes view; it must not
        // hide a note from its category or tag.
        pinnedSection.classList.add('hidden');
        othersTitle.classList.add('hidden');
        notesGrid.innerHTML = filtered.map(createCardHTML).join('');
      } else {
        const pinned = filtered.filter(n => n.isPinned && currentFilter !== 'archive');
        const others = filtered.filter(n => !n.isPinned || currentFilter === 'archive');

        if (pinned.length > 0 && currentFilter === 'all') {
          pinnedSection.classList.remove('hidden');
          othersTitle.classList.remove('hidden');
          pinnedGrid.innerHTML = pinned.map(createCardHTML).join('');
        } else {
          pinnedSection.classList.add('hidden');
          othersTitle.classList.add('hidden');
        }
        notesGrid.innerHTML = others.map(createCardHTML).join('');
      }

      renderCategories();
      renderTags();
    }

    // Normalize legacy metadata values: the string "false" must not be
    // treated as truthy. Pinned notes remain active and count toward categories.
    function isArchivedNote(note) {
      const value = note && note.isArchived;
      return value === true || value === 1 ||
        (typeof value === 'string' && ['true', '1'].includes(value.trim().toLowerCase()));
    }

    function escapeHTML(str) {
      return str ? str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)) : '';

    function normalizeTags(tagsRaw) {
      const unique = new Map();
      String(tagsRaw || '').split(',').map(tag => tag.trim()).filter(Boolean).forEach(tag => {
        const key = tag.toLocaleLowerCase();
        if (!unique.has(key)) unique.set(key, tag.slice(0, 60));
      });
      return [...unique.values()].slice(0, 50);
    }

    // Keep editor HTML limited to formatting produced by the toolbar and safe links.
    // Pasted scripts, event attributes, styles and unsafe URL schemes are removed.
    function sanitizeEditorHTML(html) {
      const parser = new DOMParser();
      const parsed = parser.parseFromString(String(html || ''), 'text/html');
      const allowedTags = new Set(['P', 'DIV', 'BR', 'STRONG', 'B', 'EM', 'I', 'U', 'S', 'STRIKE', 'H1', 'H2', 'UL', 'OL', 'LI', 'BLOCKQUOTE', 'A']);
      const cleanNode = node => {
        [...node.childNodes].forEach(child => {
          if (child.nodeType === Node.COMMENT_NODE) {
            child.remove();
            return;
          }
          if (child.nodeType !== Node.ELEMENT_NODE) return;
          if (!allowedTags.has(child.tagName)) {
            if (['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'SVG', 'MATH'].includes(child.tagName)) {
              child.remove();
            } else {
              cleanNode(child);
              child.replaceWith(...child.childNodes);
            }
            return;
          }
          const href = child.tagName === 'A' ? child.getAttribute('href') : null;
          [...child.attributes].forEach(attr => child.removeAttribute(attr.name));
          if (child.tagName === 'A' && href) {
            try {
              const url = new URL(href, window.location.href);
              if (['http:', 'https:', 'mailto:'].includes(url.protocol)) {
                child.setAttribute('href', url.href);
                child.setAttribute('rel', 'noopener noreferrer');
                child.setAttribute('target', '_blank');
              }
            } catch (error) {}
          }
          cleanNode(child);
        });
      };
      cleanNode(parsed.body);
      return parsed.body.innerHTML;
    }

    function openEditor(noteId = null) {
      activeNoteId = noteId;
      const modalTitle = document.getElementById('modal-title-input');
      const modalContentEditable = document.getElementById('editor-content-editable');
      const modalTags = document.getElementById('modal-tags-input');
      const metaCreated = document.getElementById('meta-created');
      const metaUpdated = document.getElementById('meta-updated');

      let currentNote = null;
      if (noteId) {
        currentNote = notes.find(n => String(n.id) === String(noteId));
      }
      editorBaseline = currentNote ? cloneData(currentNote) : null;

      if (currentNote) {
        modalTitle.value = currentNote.title || '';
        modalContentEditable.innerHTML = sanitizeEditorHTML(currentNote.content || '');
        modalCategorySelect.value = currentNote.category || 'Umum';
        modalTags.value = (currentNote.tags || []).join(', ');
        metaCreated.textContent = `Dibuat: ${formatDate(currentNote.createdAt)}`;
        metaUpdated.textContent = `Diperbarui: ${formatDate(currentNote.updatedAt)}`;
      } else {
        modalTitle.value = '';
        modalContentEditable.innerHTML = '';
        modalCategorySelect.value = currentCategory || 'Umum';
        modalTags.value = '';
        const nowFormatted = formatDate(new Date().toISOString());
        metaCreated.textContent = `Dibuat: ${nowFormatted}`;
        metaUpdated.textContent = `Diperbarui: ${nowFormatted}`;
      }

      // Restore only a draft belonging to this exact note (or a new-note draft).
      const draft = readEditorDraft();
      const expectedDraftId = noteId ? String(noteId) : '__new__';
      if (draft && draft.noteId === expectedDraftId) {
        const draftIsStale = Boolean(currentNote && draft.baselineUpdatedAt &&
          currentNote.updatedAt && draft.baselineUpdatedAt !== currentNote.updatedAt);
        const prompt = draftIsStale
          ? 'Ada draft lokal dari versi catatan yang lebih lama. Pulihkan draft ini? Perubahan cloud yang lebih baru tidak akan dihapus sampai Anda menekan Simpan.'
          : 'Ditemukan draft lokal yang belum disimpan. Pulihkan draft?';
        if (confirm(prompt)) {
          modalTitle.value = String(draft.title || '');
          modalContentEditable.innerHTML = sanitizeEditorHTML(draft.content || '');
          modalCategorySelect.value = String(draft.category || 'Umum');
          modalTags.value = String(draft.tagsText || '');
          setEditorDraftStatus('Draft lokal dipulihkan — periksa sebelum menyimpan.', 'text-amber-600 dark:text-amber-400');
        } else {
          clearEditorDraft();
          setEditorDraftStatus('Draft sebelumnya dibuang.', 'text-gray-400');
        }
      } else {
        setEditorDraftStatus('Perubahan akan disimpan sebagai draft lokal saat Anda mengetik.', 'text-gray-400');
      }

      editorDraftDirty = false;
      updateModalActionStates(currentNote);
      editorModal.classList.remove('hidden');
      modalContentEditable.focus();
      updateToolbarState();
    }

    function saveActiveNote() {
      const title = document.getElementById('modal-title-input').value.trim();
      const content = sanitizeEditorHTML(document.getElementById('editor-content-editable').innerHTML.trim());
      const category = String(modalCategorySelect.value || 'Umum').trim().slice(0, 120) || 'Umum';
      const tags = normalizeTags(document.getElementById('modal-tags-input').value);

      if (content.length > 500000) {
        alert('Isi catatan terlalu besar. Maksimal 500.000 karakter.');
        return;
      }
      if (title.length > 180) {
        alert('Judul terlalu panjang. Maksimal 180 karakter.');
        return;
      }
      if (!title && !content) {
        clearEditorDraft();
        editorModal.classList.add('hidden');
        activeNoteId = null;
        return;
      }

      if (activeNoteId) {
        notes = notes.map(n => String(n.id) === String(activeNoteId) ? {
          ...n, title, content, category, tags, updatedAt: new Date().toISOString()
        } : n);
      } else {
        notes.unshift({
          id: 'temp_' + Date.now(),
          title, content, category,
          isPinned: false, isArchived: false,
          tags,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        });
      }

      clearEditorDraft();
      editorModal.classList.add('hidden');
      activeNoteId = null;
      render();
      syncToBackend();
    }


    // ---------------------------------------------------------------------
    // Phase 3.1 — ZIP backup, restore, import preview, and duplicate checks
    // ---------------------------------------------------------------------
    const KEEPFLOW_BACKUP_FORMAT = 'hadi-keepflow-backup';
    const KEEPFLOW_BACKUP_SCHEMA = 1;
    const MAX_IMPORT_ZIP_BYTES = 25 * 1024 * 1024;
    const MAX_IMPORT_ENTRIES = 2000;
    const MAX_IMPORT_NOTE_BYTES = 500000;

    function callKeepFlowServer(method, ...args) {
      return new Promise((resolve, reject) => {
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          reject(new Error('Google Apps Script tidak tersedia.'));
          return;
        }
        const runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(error => reject(new Error(error && error.message ? error.message : String(error))));
        if (typeof runner[method] !== 'function') {
          reject(new Error('Fungsi server tidak tersedia: ' + method));
          return;
        }
        runner[method](...args);
      });
    }

    function safeBackupSegment(value, fallback) {
      const cleaned = String(value || '')
        .replace(/[\/\\?%*:|"<>]/g, '-')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/[. ]+$/g, '')
        .slice(0, 180);
      return cleaned || fallback;
    }

    function makeBackupNoteFile(note) {
      const metadata = {
        isPinned: Boolean(note.isPinned),
        isArchived: Boolean(note.isArchived),
        tags: Array.isArray(note.tags) ? note.tags.filter(tag => typeof tag === 'string') : [],
        createdAt: note.createdAt || new Date().toISOString()
      };
      return '---JSON---\n' + JSON.stringify(metadata, null, 2) +
        '\n---JSON---\n\n' + String(note.content || '');
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function ensureBackupReady() {
      if (!navigator.onLine) throw new Error('Backup dan restore memerlukan koneksi internet.');
      if (typeof JSZip === 'undefined') throw new Error('Library ZIP belum termuat. Muat ulang aplikasi dan coba lagi.');
      if (syncRunning || cloudLoadInProgress || pendingOperations.length > 0 || pendingCategoryCreates.length > 0) {
        throw new Error('Masih ada proses sinkronisasi atau antrean tertunda. Tunggu sampai status tersinkron, lalu coba lagi.');
      }
      if (editorDraftDirty) throw new Error('Simpan atau batalkan draft editor terlebih dahulu sebelum backup/restore.');
      if (!serverReady) throw new Error('Data cloud belum siap. Tunggu proses pemuatan selesai.');
    }


    // Shared visual progress UI for long-running backup and restore tasks.
    function showDataProgress(title, stage, detail, percent, indeterminate) {
      const overlay = document.getElementById('data-progress-overlay');
      overlay.classList.remove('hidden');
      overlay.classList.add('is-open');
      document.getElementById('data-progress-title').textContent = title;
      document.getElementById('data-progress-close').classList.add('hidden');
      updateDataProgress(stage, detail, percent, indeterminate);
    }

    function updateDataProgress(stage, detail, percent, indeterminate) {
      const fill = document.getElementById('data-progress-fill');
      const track = document.getElementById('data-progress-track');
      const safePercent = Math.max(0, Math.min(100, Number(percent) || 0));
      document.getElementById('data-progress-stage').textContent = stage || '';
      document.getElementById('data-progress-detail').textContent = detail || '';
      document.getElementById('data-progress-percent').textContent = indeterminate ? '…' : Math.round(safePercent) + '%';
      track.setAttribute('aria-valuenow', String(Math.round(safePercent)));
      fill.classList.toggle('is-indeterminate', Boolean(indeterminate));
      if (!indeterminate) fill.style.width = safePercent + '%';
    }

    function finishDataProgress(stage, detail, isError) {
      const fill = document.getElementById('data-progress-fill');
      fill.classList.remove('is-indeterminate');
      fill.style.width = isError ? fill.style.width : '100%';
      updateDataProgress(stage, detail, isError ? Number(document.getElementById('data-progress-track').getAttribute('aria-valuenow')) : 100, false);
      const icon = document.getElementById('data-progress-icon');
      icon.innerHTML = isError
        ? '<i class="fa-solid fa-triangle-exclamation text-lg"></i>'
        : '<i class="fa-solid fa-circle-check text-lg"></i>';
      icon.className = isError
        ? 'h-10 w-10 rounded-xl bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-300 flex items-center justify-center shrink-0'
        : 'h-10 w-10 rounded-xl bg-green-50 dark:bg-green-900/30 text-green-600 dark:text-green-300 flex items-center justify-center shrink-0';
      document.getElementById('data-progress-close').classList.remove('hidden');
    }

    function hideDataProgress() {
      const overlay = document.getElementById('data-progress-overlay');
      overlay.classList.add('hidden');
      overlay.classList.remove('is-open');
      document.getElementById('data-progress-fill').classList.remove('is-indeterminate');
      document.getElementById('data-progress-fill').style.width = '0%';
      document.getElementById('data-progress-icon').innerHTML = '<i class="fa-solid fa-cloud-arrow-down text-lg"></i>';
      document.getElementById('data-progress-icon').className = 'h-10 w-10 rounded-xl bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-300 flex items-center justify-center shrink-0';
    }

    function yieldToBrowser() {
      return new Promise(resolve => requestAnimationFrame(() => resolve()));
    }

    document.getElementById('data-progress-close').addEventListener('click', hideDataProgress);

    async function createKeepFlowBackup() {
      const button = document.getElementById('backup-zip-btn');
      try {
        ensureBackupReady();
        button.disabled = true;
        button.classList.add('opacity-50');
        showDataProgress('Membuat Backup ZIP', 'Mengambil data dari Google Drive', 'Mengambil snapshot catatan dan kategori...', 3, true);
        setSyncStatus('Menyiapkan backup ZIP...', 'fa-circle-notch fa-spin', 'text-blue-500');

        // Fetch an authoritative, atomic cloud snapshot.
        const snapshot = await callKeepFlowServer('getBackupSnapshot');
        if (!snapshot || !Array.isArray(snapshot.notes) || !Array.isArray(snapshot.categories)) {
          throw new Error('Respons snapshot cloud tidak valid.');
        }
        const cloudNotes = snapshot.notes;
        const cloudCategories = snapshot.categories;
        updateDataProgress('Menyiapkan arsip', cloudNotes.length + ' catatan ditemukan.', 12, false);
        await yieldToBrowser();

        const zip = new JSZip();
        const manifest = {
          format: KEEPFLOW_BACKUP_FORMAT,
          schemaVersion: KEEPFLOW_BACKUP_SCHEMA,
          application: 'Hadi KeepFlow',
          applicationVersion: '1.3.0.1',
          createdAt: snapshot.generatedAt || new Date().toISOString(),
          noteCount: cloudNotes.length,
          categories: [...new Set(['Umum', ...cloudCategories])],
          notes: []
        };

        for (let index = 0; index < cloudNotes.length; index++) {
          const note = cloudNotes[index];
          const category = safeBackupSegment(note.category || 'Umum', 'Umum').slice(0, 120);
          const title = safeBackupSegment(note.title || ('Catatan ' + (index + 1)), 'Catatan Tanpa Judul');
          const filename = title + '.md';
          const path = category + '/' + filename;
          zip.file(path, makeBackupNoteFile(note));
          manifest.notes.push({
            path,
            category,
            title,
            originalId: String(note.id || ''),
            updatedAt: note.updatedAt || ''
          });

          const percent = cloudNotes.length ? 12 + ((index + 1) / cloudNotes.length) * 48 : 60;
          updateDataProgress('Mengumpulkan catatan', 'Menambahkan catatan ' + (index + 1) + ' dari ' + cloudNotes.length, percent, false);
          if (index % 20 === 0) await yieldToBrowser();
        }

        manifest.categories.forEach(category => zip.folder(safeBackupSegment(category, 'Umum')));
        zip.file('manifest.json', JSON.stringify(manifest, null, 2));
        updateDataProgress('Mengompres arsip ZIP', 'Menyiapkan file untuk diunduh...', 62, false);
        await yieldToBrowser();

        const blob = await zip.generateAsync({
          type: 'blob',
          compression: 'DEFLATE',
          compressionOptions: { level: 6 }
        }, metadata => {
          updateDataProgress(
            'Mengompres arsip ZIP',
            'Proses kompresi ' + Math.round(metadata.percent) + '%',
            62 + (metadata.percent * 0.36),
            false
          );
        });

        downloadBlob(blob, 'hadi_keepflow_backup_' + new Date().toISOString().slice(0, 10) + '.zip');
        finishDataProgress('Backup selesai', cloudNotes.length + ' catatan dan ' + manifest.categories.length + ' kategori berhasil di-backup.', false);
        setSyncStatus('Backup ZIP berhasil dibuat', 'fa-cloud-arrow-down', 'text-green-500');
        await new Promise(resolve => setTimeout(resolve, 900));
        hideDataProgress();
        alert('Backup selesai. ' + cloudNotes.length + ' catatan dan ' + manifest.categories.length + ' kategori disimpan ke ZIP.');
      } catch (error) {
        console.error('KeepFlow backup error:', error);
        finishDataProgress('Backup gagal', error.message, true);
        setSyncStatus('Backup gagal', 'fa-triangle-exclamation', 'text-red-500');
        alert('Backup gagal: ' + error.message);
        hideDataProgress();
      } finally {
        button.disabled = false;
        button.classList.remove('opacity-50');
      }
    }

    function parseBackupNoteFile(rawText, path) {
      let content = String(rawText || '');
      let metadata = {};
      if (content.startsWith('---JSON---')) {
        const parts = content.split('---JSON---');
        if (parts.length >= 3) {
          try {
            metadata = JSON.parse(parts[1].trim()) || {};
            content = parts.slice(2).join('---JSON---').replace(/^\s+/, '');
          } catch (error) {
            throw new Error('Metadata JSON tidak valid pada ' + path);
          }
        }
      }
      const segments = path.split('/').filter(Boolean);
      const category = segments.length > 1 ? segments[segments.length - 2] : 'Umum';
      const filename = segments[segments.length - 1] || '';
      const title = filename.replace(/\.(md|txt)$/i, '');
      if (!title || title.length > 180 || category.length > 120 || content.length > MAX_IMPORT_NOTE_BYTES) {
        throw new Error('Judul, kategori, atau isi catatan tidak memenuhi batas ukuran pada ' + path);
      }
      const tags = Array.isArray(metadata.tags) ? metadata.tags.filter(tag => typeof tag === 'string' && tag.length <= 60).slice(0, 50) : [];
      return {
        id: 'import_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10),
        title,
        content,
        category: category || 'Umum',
        isPinned: metadata.isPinned === true || metadata.isPinned === 1 || String(metadata.isPinned).toLowerCase() === 'true',
        isArchived: metadata.isArchived === true || metadata.isArchived === 1 || String(metadata.isArchived).toLowerCase() === 'true',
        tags,
        createdAt: metadata.createdAt || new Date().toISOString()
      };
    }

    function importDuplicateKey(note) {
      return (String(note.category || 'Umum').trim().toLocaleLowerCase() + '\u0000' +
        String(note.title || '').trim().toLocaleLowerCase());
    }

    function importContentSignature(note) {
      return String(note.content || '');
    }

    async function inspectKeepFlowZip(file) {
      if (!file || !/\.zip$/i.test(file.name)) throw new Error('Pilih file ZIP KeepFlow.');
      if (file.size > MAX_IMPORT_ZIP_BYTES) throw new Error('Ukuran ZIP melebihi batas 25 MB.');
      updateDataProgress('Membaca arsip ZIP', 'Membuka dan memeriksa struktur arsip...', 8, true);
      const zip = await JSZip.loadAsync(file, { checkCRC32: true });
      const entries = Object.values(zip.files).filter(entry => !entry.dir && /\.(md|txt)$/i.test(entry.name));
      if (entries.length > MAX_IMPORT_ENTRIES) throw new Error('ZIP berisi terlalu banyak file (maksimal 2.000 catatan).');
      // Reject oversized expanded entries before decompressing them into browser memory.
      let declaredExpandedBytes = 0;
      for (const entry of entries) {
        const expandedSize = entry._data && Number(entry._data.uncompressedSize);
        if (!Number.isFinite(expandedSize) || expandedSize < 0 || expandedSize > MAX_IMPORT_NOTE_BYTES + 20000) {
          throw new Error('Ukuran file di dalam ZIP tidak valid atau terlalu besar: ' + entry.name);
        }
        declaredExpandedBytes += expandedSize;
        if (declaredExpandedBytes > MAX_IMPORT_ZIP_BYTES) {
          throw new Error('Total ukuran hasil ekstraksi ZIP melebihi 25 MB.');
        }
      }

      let manifest = null;
      if (zip.file('manifest.json')) {
        try {
          manifest = JSON.parse(await zip.file('manifest.json').async('string'));
          if (manifest.format !== KEEPFLOW_BACKUP_FORMAT || manifest.schemaVersion !== KEEPFLOW_BACKUP_SCHEMA) {
            throw new Error('Versi format backup tidak didukung.');
          }
        } catch (error) {
          throw new Error('Manifest backup tidak valid: ' + error.message);
        }
      }

      const imported = [];
      const invalid = [];
      let totalBytes = 0;
      let processedDeclaredBytes = 0;
      const totalDeclaredBytes = Math.max(1, declaredExpandedBytes);
      for (let entryIndex = 0; entryIndex < entries.length; entryIndex++) {
        const entry = entries[entryIndex];
        const entrySize = Number(entry._data.uncompressedSize) || 0;
        try {
          if (entry.name.startsWith('/') || entry.name.includes('\\') || /^[A-Za-z]:/.test(entry.name)) {
            throw new Error('Path file tidak aman.');
          }
          const segments = entry.name.split('/').filter(Boolean);
          if (segments.length < 1 || segments.length > 2 || segments.some(part => part === '.' || part === '..')) {
            throw new Error('Struktur folder tidak didukung.');
          }
          const raw = await entry.async('string', metadata => {
            const withinEntry = entrySize * ((metadata && Number(metadata.percent)) || 0) / 100;
            const overall = (processedDeclaredBytes + withinEntry) / totalDeclaredBytes;
            updateDataProgress(
              'Membaca catatan dari ZIP',
              'Memeriksa file ' + (entryIndex + 1) + ' dari ' + entries.length,
              10 + (overall * 24),
              false
            );
          });
          totalBytes += new Blob([raw]).size;
          if (totalBytes > MAX_IMPORT_ZIP_BYTES) throw new Error('Total data hasil ekstraksi melebihi 25 MB.');
          imported.push(parseBackupNoteFile(raw, entry.name));
        } catch (error) {
          invalid.push({ path: entry.name, message: error.message });
        }
        processedDeclaredBytes += entrySize;
        if (entryIndex % 15 === 0) await yieldToBrowser();
      }
      updateDataProgress('Menganalisis isi arsip', 'Mendeteksi duplikasi dan konflik...', 35, false);
      await yieldToBrowser();

      const importedCategories = new Set();
      if (manifest && Array.isArray(manifest.categories)) {
        manifest.categories.forEach(name => {
          if (typeof name === 'string' && name.trim() && name.length <= 120) importedCategories.add(name.trim());
        });
        if (importedCategories.size > 500) throw new Error('Backup mencantumkan terlalu banyak kategori (maksimal 500).');
      }
      imported.forEach(note => importedCategories.add(note.category));
      importedCategories.add('Umum');

      const currentByKey = new Map();
      notes.forEach(note => {
        const key = importDuplicateKey(note);
        if (!currentByKey.has(key)) currentByKey.set(key, []);
        currentByKey.get(key).push(note);
      });

      const newNotes = [];
      let exactDuplicates = 0;
      let titleConflicts = 0;
      imported.forEach(note => {
        const matches = currentByKey.get(importDuplicateKey(note)) || [];
        if (!matches.length) {
          newNotes.push(note);
          currentByKey.set(importDuplicateKey(note), [note]);
          return;
        }
        if (matches.some(existing => importContentSignature(existing) === importContentSignature(note))) {
          exactDuplicates++;
        } else {
          titleConflicts++;
        }
      });

      return {
        notes: newNotes,
        categories: [...importedCategories],
        exactDuplicates,
        titleConflicts,
        invalid,
        sourceNoteCount: entries.length,
        manifest
      };
    }

    async function saveImportedNote(note, index) {
      const result = await callKeepFlowServer('saveNote', note, 'zip-import-' + Date.now() + '-' + index + '-' + Math.random().toString(36).slice(2, 8));
      if (!result || result.status !== 'success' || !result.note) {
        throw new Error((result && result.message) || 'Server tidak mengonfirmasi penyimpanan catatan.');
      }
      return result.note;
    }

    async function restoreKeepFlowZip(file) {
      const input = document.getElementById('restore-zip-file');
      input.disabled = true;
      try {
        ensureBackupReady();
        showDataProgress('Restore / Import ZIP', 'Memeriksa arsip', 'Membaca file ZIP dan memvalidasi isinya...', 5, true);
        setSyncStatus('Memeriksa arsip ZIP...', 'fa-circle-notch fa-spin', 'text-blue-500');
        const preview = await inspectKeepFlowZip(file);
        const invalidCount = preview.invalid.length;
        const summary = [
          'Ringkasan restore/import:',
          '• Catatan dalam ZIP: ' + preview.sourceNoteCount,
          '• Catatan baru: ' + preview.notes.length,
          '• Duplikat identik (akan dilewati): ' + preview.exactDuplicates,
          '• Judul sama, isi berbeda (akan dilewati): ' + preview.titleConflicts,
          '• File tidak valid (akan dilewati): ' + invalidCount,
          '• Kategori: ' + preview.categories.length,
          '',
          'Data yang sudah ada tidak akan dihapus atau ditimpa.',
          'Lanjutkan?'
        ].join('\n');
        updateDataProgress('Preview siap', preview.notes.length + ' catatan baru siap dipulihkan.', 36, false);
        await yieldToBrowser();
        if (!confirm(summary)) {
          setSyncStatus('Restore dibatalkan', 'fa-cloud', 'text-gray-400');
          hideDataProgress();
          return;
        }

        let categoriesCreated = 0;
        const categoriesToCreate = preview.categories.filter(category => category.toLocaleLowerCase() !== 'umum');
        for (let i = 0; i < categoriesToCreate.length; i++) {
          const category = categoriesToCreate[i];
          updateDataProgress(
            'Menyiapkan kategori',
            'Memproses kategori ' + (i + 1) + ' dari ' + categoriesToCreate.length + ': ' + category,
            categoriesToCreate.length ? 36 + ((i + 1) / categoriesToCreate.length) * 9 : 45,
            false
          );
          const response = await callKeepFlowServer('createCategoryFolder', category);
          if (!response || response.status !== 'success') {
            throw new Error((response && response.message) || ('Gagal membuat kategori ' + category));
          }
          categoriesCreated++;
        }

        let saved = 0;
        const importedNotes = [];
        for (let i = 0; i < preview.notes.length; i++) {
          updateDataProgress(
            'Memulihkan catatan',
            'Menyimpan catatan ' + (i + 1) + ' dari ' + preview.notes.length + ': ' + preview.notes[i].title,
            preview.notes.length ? 45 + ((i + 1) / preview.notes.length) * 52 : 97,
            false
          );
          setSyncStatus('Memulihkan catatan ' + (i + 1) + ' dari ' + preview.notes.length + '...', 'fa-circle-notch fa-spin', 'text-blue-500');
          const savedNote = await saveImportedNote(preview.notes[i], i);
          importedNotes.push(savedNote);
          saved++;
        }

        updateDataProgress('Memperbarui daftar catatan', 'Memperbarui cache lokal dan kategori...', 98, false);
        // Merge into local state only after each cloud write has been acknowledged.
        const byId = new Map(notes.map(note => [String(note.id), note]));
        importedNotes.forEach(note => byId.set(String(note.id), note));
        notes = [...byId.values()];
        lastObservedNotes = cloneData(notes);
        persistLocal();
        reconcileCloudCategories(await callKeepFlowServer('getCategories'));
        render();
        finishDataProgress('Restore selesai', saved + ' catatan berhasil dipulihkan. Data lama tetap aman.', false);
        setSyncStatus('Restore selesai', 'fa-cloud-arrow-up', 'text-green-500');
        await new Promise(resolve => setTimeout(resolve, 900));
        hideDataProgress();
        alert(
          'Restore selesai.\n' +
          'Catatan ditambahkan: ' + saved + '\n' +
          'Duplikat dilewati: ' + preview.exactDuplicates + '\n' +
          'Konflik judul dilewati: ' + preview.titleConflicts + '\n' +
          'File tidak valid dilewati: ' + invalidCount + '\n' +
          'Kategori diperiksa/dibuat: ' + categoriesCreated + '\n\n' +
          'Catatan yang sudah ada tidak dihapus atau ditimpa.'
        );
      } catch (error) {
        console.error('KeepFlow restore error:', error);
        finishDataProgress('Restore gagal / terhenti', error.message, true);
        setSyncStatus('Restore berhenti - periksa data cloud', 'fa-triangle-exclamation', 'text-red-500');
        alert('Restore tidak selesai: ' + error.message + '\n\nCatatan yang sudah berhasil disimpan tetap berada di Google Drive. Jalankan restore lagi untuk melanjutkan; duplikat akan dilewati.');
        hideDataProgress();
        // Refresh cloud state after a partial restore so the UI reflects acknowledged writes.
        try { loadInitialData(); } catch (refreshError) { console.warn(refreshError); }
      } finally {
        input.disabled = false;
        input.value = '';
      }
    }

    document.getElementById('backup-zip-btn').addEventListener('click', createKeepFlowBackup);
    document.getElementById('restore-zip-file').addEventListener('change', event => {
      const file = event.target.files && event.target.files[0];
      if (file) restoreKeepFlowZip(file);
    });

    document.getElementById('toggle-view-mode').addEventListener('click', () => {
      isListView = !isListView;
      const viewIcon = document.getElementById('view-mode-icon');
      viewIcon.className = isListView ? 'fa-solid fa-border-all text-lg' : 'fa-solid fa-list text-lg';
      render();
    });

    document.getElementById('date-filter-toggle').addEventListener('click', () => {
      const panel = document.getElementById('date-filter-panel');
      const opening = panel.classList.contains('hidden');
      panel.classList.toggle('hidden', !opening);
      document.getElementById('date-filter-toggle').setAttribute('aria-expanded', String(opening));
    });

    document.getElementById('date-preset-select').addEventListener('change', (e) => {
      datePreset = e.target.value;
      const customInputs = document.getElementById('custom-date-inputs');
      if (datePreset === 'custom') customInputs.classList.remove('hidden');
      else {
        customInputs.classList.add('hidden');
        customStartDate = null; customEndDate = null;
        render();
      }
    });

    document.getElementById('apply-date-range').addEventListener('click', () => {
      customStartDate = document.getElementById('start-date-input').value;
      customEndDate = document.getElementById('end-date-input').value;
      render();
    });

    document.getElementById('reset-date-filter').addEventListener('click', () => {
      datePreset = 'all';
      document.getElementById('date-preset-select').value = 'all';
      document.getElementById('custom-date-inputs').classList.add('hidden');
      customStartDate = null; customEndDate = null;
      document.getElementById('date-filter-panel').classList.add('hidden');
      document.getElementById('date-filter-toggle').setAttribute('aria-expanded', 'false');
      render();
    });

    document.getElementById('add-category-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      const newCat = prompt('Masukkan nama kategori baru:');
      if (newCat && newCat.trim()) addCategory(newCat);
    });

    document.getElementById('quick-add-trigger').addEventListener('click', () => openEditor(null));
    document.getElementById('modal-close-btn').addEventListener('click', () => {
      const title = document.getElementById('modal-title-input').value.trim();
      const content = document.getElementById('editor-content-editable').innerHTML.trim();
      const current = activeNoteId ? notes.find(n => String(n.id) === String(activeNoteId)) : null;
      const changed = activeNoteId
        ? current && (title !== (current.title || '') || content !== (current.content || '') ||
            document.getElementById('modal-tags-input').value !== (current.tags || []).join(', ') ||
            modalCategorySelect.value !== (current.category || 'Umum'))
        : Boolean(title || content);
      if (changed && !confirm('Perubahan belum disimpan. Tutup editor dan buang perubahan?')) return;
      if (changed) clearEditorDraft();
      else clearEditorDraft();
      editorModal.classList.add('hidden');
      activeNoteId = null;
      editorBaseline = null;
    });
    document.getElementById('modal-save-btn').addEventListener('click', saveActiveNote);
    document.addEventListener('keydown', event => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's' &&
          !editorModal.classList.contains('hidden')) {
        event.preventDefault();
        saveActiveNote();
      }
    });

    // Local draft autosave is deliberately separate from cloud sync: typing
    // never creates a Drive operation until the user explicitly presses Simpan.
    ['modal-title-input', 'editor-content-editable', 'modal-category-select', 'modal-tags-input'].forEach(id => {
      const element = document.getElementById(id);
      if (!element) return;
      element.addEventListener('input', scheduleEditorDraftSave);
      element.addEventListener('change', scheduleEditorDraftSave);
    });
    window.addEventListener('beforeunload', () => {
      if (!editorModal.classList.contains('hidden') && editorDraftDirty) persistEditorDraft();
    });

    document.getElementById('modal-pin-btn').addEventListener('click', () => {
      if (!activeNoteId) return;

      const current = notes.find(n => String(n.id) === String(activeNoteId));
      if (!current) return;

      const updated = {
        ...current,
        isPinned: !Boolean(current.isPinned),
        updatedAt: new Date().toISOString()
      };

      notes = notes.map(n =>
        String(n.id) === String(activeNoteId) ? updated : n
      );

      // Update the button immediately; the editor stays open, so the user
      // can see the new pin state without closing and reopening the note.
      updateModalActionStates(updated);
      const pinButton = document.getElementById('modal-pin-btn');
      pinButton.title = updated.isPinned ? 'Lepas Pin' : 'Sematkan';

      render();
      syncToBackend();
    });

    document.getElementById('modal-archive-btn').addEventListener('click', () => {
      if (activeNoteId) {
        notes = notes.map(n => n.id === activeNoteId ? { ...n, isArchived: !n.isArchived, updatedAt: new Date().toISOString() } : n);
        editorModal.classList.add('hidden');
        render(); syncToBackend();
      }
    });

    document.getElementById('modal-delete-btn').addEventListener('click', () => {
      if (activeNoteId) {
        if (confirm('Apakah Anda yakin ingin menghapus catatan ini secara permanen dari perangkat dan Google Drive?')) {
          // 1. Hapus catatan dari array notes utama
          notes = notes.filter(n => n.id !== activeNoteId);
          
          // 2. Tutup modal editor
          editorModal.classList.add('hidden');
          
          // 3. Reset ID aktif
          activeNoteId = null;
          
          // 4. Render ulang tampilan layar
          render();
          
          // 5. [PENTING] Panggil syncToBackend() agar perubahan data yang sudah dihapus 
          //    langsung dikirim ke server Apps Script dan diperbarui di Google Drive
          syncToBackend();
        }
      } else {
        alert('Tidak ada catatan yang sedang aktif untuk dihapus.');
      }
    });

    document.getElementById('empty-state-create').addEventListener('click', () => openEditor(null));

    document.getElementById('clear-view-filter').addEventListener('click', () => {
      currentFilter = 'all';
      currentCategory = null;
      currentTag = null;
      render();
    });

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      if (searchRenderTimer) clearTimeout(searchRenderTimer);
      searchRenderTimer = setTimeout(() => {
        searchRenderTimer = null;
        render();
      }, SEARCH_DEBOUNCE_MS);
    });

    document.getElementById('toggle-theme').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const icon = document.getElementById('theme-icon');
      icon.classList.toggle('fa-moon'); icon.classList.toggle('fa-sun');
    });

    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        currentFilter = btn.dataset.filter;
        currentCategory = null;
        currentTag = null;
        closeSidebar();
        render();
      });
    });

    document.getElementById('toggle-sidebar').addEventListener('click', toggleSidebar);
    sidebarBackdrop.addEventListener('click', closeSidebar);
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeSidebar();
    });
    window.addEventListener('resize', () => {
      if (!window.matchMedia('(max-width: 1023px)').matches) {
        sidebar.classList.remove('sidebar-open');
        sidebarBackdrop.classList.remove('sidebar-backdrop-open');
        document.getElementById('toggle-sidebar').setAttribute('aria-expanded', String(!sidebar.classList.contains('sidebar-collapsed')));
      } else {
        sidebar.classList.remove('sidebar-collapsed');
      }
    });

    document.getElementById('retry-sync').addEventListener('click', () => {
      if (!pendingOperations.length) return;
      const head = pendingOperations[0];
      head.attempts = 0;
      head.nextAttemptAt = '';
      head.lastError = '';
      persistLocal();
      showManualRetry(false);
      if (serverReady) flushPendingOperations();
      else loadInitialData();
    });

    window.addEventListener('online', () => {
      // Refresh the cloud baseline on every reconnect before replaying queued
      // writes. This catches changes made from another tab/device.
      clearRetryTimer();
      loadInitialData();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      // Recover timers that may have been throttled while the tab was hidden.
      if (pendingOperations.length && serverReady && !syncRunning) {
        schedulePendingRetry();
      }
    });

    window.addEventListener('pageshow', () => {
      // Queue and note snapshots are persisted continuously; resume safely.
      if (pendingOperations.length && navigator.onLine) loadInitialData();
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadInitialData();
    });
  </script>
