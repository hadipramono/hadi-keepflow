<!-- Main frontend application script. Included by Index.html. -->
  <script>
    // Hadi KeepFlow v1.3.8
    let notes = [];
    let currentFilter = 'all';
    let activeSection = 'dashboard';
    const PREFERENCES_KEY = 'hadi_keepflow_preferences_v1';
    let userPreferences = { displayName: '', theme: 'system', layout: 'grid', sort: 'updated_desc' };
    let currentCategory = null;
    let currentTag = null;
    let searchQuery = '';
    let isListView = false;
    let activeNoteId = null;
    function hasActiveNoteId() {
      return activeNoteId !== null && activeNoteId !== undefined && String(activeNoteId) !== '';
    }
    let searchRenderTimer = null;
    const SEARCH_DEBOUNCE_MS = 120;
    const SEARCH_HISTORY_KEY = 'hadi_keepflow_search_history_v1';
    const SEARCH_HISTORY_LIMIT = 8;
    let recentSearches = [];
    let sortMode = 'updated_desc';
    let selectionMode = false;
    const selectedNoteIds = new Set();
    const plainTextCache = new WeakMap();
    const DRAFT_KEY = 'hadi_keepflow_editor_draft_v1';
    const DRAFT_AUTOSAVE_MS = 650;
    let draftSaveTimer = null;
    let editorBaseline = null;
    let editorDraftDirty = false;
    let savedEditorRange = null;
    
    let datePreset = 'all';
    let customStartDate = null;
    let customEndDate = null;

    const LOCAL_KEY = 'hadi_keepflow_offline_notes_v1';
    const CATEGORY_STATE_KEY = 'hadi_keepflow_categories_v1';
    const DEFAULT_CATEGORIES = [];
    let categories = [...DEFAULT_CATEGORIES];
    let pendingCategoryCreates = [];

    function normalizeNoteCategory(value) {
      const category = String(value == null ? '' : value).trim();
      return !category || category.toLocaleLowerCase() === 'umum' ? '' : category;
    }

    function normalizeBooleanFlag(value) {
      return value === true || value === 1 ||
        (typeof value === 'string' && ['true', '1'].includes(value.trim().toLocaleLowerCase()));
    }

    function normalizeNoteRecord(note) {
      if (!note || typeof note !== 'object') return note;
      return {
        ...note,
        category: normalizeNoteCategory(note.category),
        isPinned: normalizeBooleanFlag(note.isPinned),
        isArchived: normalizeBooleanFlag(note.isArchived)
      };
    }

    function loadCategoryState() {
      try {
        const state = JSON.parse(localStorage.getItem(CATEGORY_STATE_KEY) || '{}');
        categories = [...new Set([
          ...DEFAULT_CATEGORIES,
          ...(Array.isArray(state.categories) ? state.categories : [])
            .filter(name => typeof name === 'string' && name.trim() && name.toLocaleLowerCase() !== 'umum')
        ])];
        pendingCategoryCreates = Array.isArray(state.pendingCreates)
          ? state.pendingCreates.filter(name => typeof name === 'string' && name.trim() && name.toLocaleLowerCase() !== 'umum')
          : [];
      } catch (error) {
        categories = [...DEFAULT_CATEGORIES];
        pendingCategoryCreates = [];
      }
    }

    function pruneLegacyDefaultCategoriesFromLocalState() {
      const legacyDefaults = new Set(['Pekerjaan', 'Pribadi']);
      const noteCategories = new Set(notes.map(note => normalizeNoteCategory(note.category)).filter(Boolean));
      categories = categories.filter(category =>
        !legacyDefaults.has(category) || noteCategories.has(category) || pendingCategoryCreates.includes(category)
      );
      persistCategoryState();
    }

    function persistCategoryState() {
      try {
        localStorage.setItem(CATEGORY_STATE_KEY, JSON.stringify({ categories, pendingCreates: pendingCategoryCreates }));
      } catch (error) {
        console.error('KeepFlow category persistence error:', error);
      }
    }

    function mergeCategories(names) {
      if (!Array.isArray(names)) return;
      categories = [...new Set([...DEFAULT_CATEGORIES, ...categories, ...names.map(name => String(name).trim()).filter(name => name && name.toLocaleLowerCase() !== 'umum')])];
      persistCategoryState();
      renderCategories();
    }

    function reconcileCloudCategories(names) {
      if (!Array.isArray(names)) return;
      const noteCategories = notes.map(note => normalizeNoteCategory(note.category)).filter(Boolean);
      categories = [...new Set([
        ...DEFAULT_CATEGORIES,
        ...names.map(name => String(name).trim()).filter(name => name && name.toLocaleLowerCase() !== 'umum'),
        ...noteCategories,
        ...pendingCategoryCreates
      ])];
      persistCategoryState();
      renderCategories();
    }

    function syncPendingCategoryCreates() {
      if (!pendingCategoryCreates.length || !navigator.onLine ||
          typeof google === 'undefined' || !google.script || !google.script.run) return;
      const category = pendingCategoryCreates[0];
      google.script.run
        .withSuccessHandler(response => {
          if (!response || response.status !== 'success') {
            setSyncStatus((response && response.message) || 'Kategori belum tersimpan di cloud', 'fa-triangle-exclamation', 'text-amber-500');
            return;
          }
          pendingCategoryCreates = pendingCategoryCreates.filter(name => name !== category);
          reconcileCloudCategories(response.categories || [response.category]);
          persistCategoryState();
          if (pendingCategoryCreates.length) syncPendingCategoryCreates();
        })
        .withFailureHandler(error => {
          console.error('KeepFlow create category error:', error);
          setSyncStatus('Gagal menyimpan kategori - akan dicoba lagi saat online', 'fa-triangle-exclamation', 'text-amber-500');
        })
        .createCategoryFolder(category);
    }

    function refreshCloudCategories() {
      if (!navigator.onLine || typeof google === 'undefined' || !google.script || !google.script.run) return;
      google.script.run
        .withSuccessHandler(names => {
          reconcileCloudCategories(names);
          syncPendingCategoryCreates();
        })
        .withFailureHandler(error => {
          console.warn('KeepFlow category load failed:', error);
          syncPendingCategoryCreates();
        })
        .getCategories();
    }

    function ensureCategoryManagementReady() {
      if (!navigator.onLine || typeof google === 'undefined' || !google.script || !google.script.run) {
        notify('Pengelolaan kategori memerlukan koneksi internet.');
        return false;
      }
      if (!serverReady || cloudLoadInProgress || syncRunning) {
        notify('Tunggu sampai data cloud selesai dimuat dan sinkronisasi tidak sedang berjalan.');
        return false;
      }
      if (pendingOperations.length || pendingCategoryCreates.length) {
        notify('Masih ada antrean sinkronisasi. Tunggu sampai semua perubahan tersinkron sebelum mengubah atau menghapus kategori.');
        return false;
      }
      if (hasUnsavedEditorChanges()) {
        notify('Simpan atau batalkan draft editor terlebih dahulu sebelum mengubah kategori.');
        return false;
      }
      return true;
    }

    function addCategory(categoryName) {
      const name = String(categoryName || '').replace(/[\/\\?%*:|"<>]/g, '-').replace(/\s+/g, ' ').trim().slice(0, 120);
      if (!name) return;
      if (name.toLocaleLowerCase() === 'umum') {
        notify('Nama kategori tersebut tidak tersedia. Catatan tanpa kategori disimpan di Inbox.');
        return;
      }
      const existing = categories.find(item => item.toLowerCase() === name.toLowerCase());
      const finalName = existing || name;
      mergeCategories([finalName]);
      currentCategory = finalName;
      currentFilter = 'category';
      currentTag = null;
      if (!pendingCategoryCreates.includes(finalName)) pendingCategoryCreates.push(finalName);
      persistCategoryState();
      render();
      syncPendingCategoryCreates();
    }

    function updateToolbarState() {
      document.querySelectorAll('.toolbar-btn').forEach(btn => {
        const cmd = btn.getAttribute('data-command');
        const val = btn.getAttribute('data-value');
        let active = false;
        try {
          if (cmd === 'formatBlock') {
            active = document.queryCommandValue(cmd).toLowerCase() === val.replace(/<|>/g, '').toLowerCase();
          } else {
            active = document.queryCommandState(cmd);
          }
        } catch (e) {}
        if (active) btn.classList.add('active');
        else btn.classList.remove('active');
      });
    }

    // Non-blocking message that replaces window.alert(): it does not freeze the
    // page (important inside the Apps Script iframe) and is announced to screen
    // readers. Warnings stay longer and use role="alert".
    function notify(message, kind) {
      const text = String(message == null ? '' : message).trim();
      if (!text) return;
      const type = kind || (/(gagal|tidak (dapat|valid|boleh|tersedia|memenuhi|selesai)|terlalu|wajib|masih ada|tunggu|memerlukan|belum|pilih )/i.test(text)
        ? 'warn'
        : (/(berhasil|selesai)/i.test(text) ? 'success' : 'info'));
      const region = document.getElementById('toast-region');
      if (!region) { window.alert(text); return; }

      const toast = document.createElement('div');
      toast.className = 'kf-toast kf-toast-' + type;
      toast.setAttribute('role', type === 'warn' ? 'alert' : 'status');
      const body = document.createElement('p');
      body.className = 'kf-toast-text';
      body.textContent = text;
      const close = document.createElement('button');
      close.type = 'button';
      close.className = 'kf-toast-close';
      close.setAttribute('aria-label', 'Tutup notifikasi');
      close.textContent = '\u00d7';
      const dismiss = () => { clearTimeout(timer); toast.remove(); };
      close.addEventListener('click', dismiss);
      toast.append(body, close);
      region.appendChild(toast);
      while (region.children.length > 4) region.firstElementChild.remove();
      const lifetime = type === 'warn' ? Math.min(15000, 6000 + text.length * 40) : Math.min(8000, 3500 + text.length * 30);
      const timer = setTimeout(dismiss, lifetime);
    }

    // Checklist checkboxes live inside contenteditable HTML whose attributes are
    // stripped on save, so the accessible name is applied at edit time only.
    function labelEditorCheckboxes(editor) {
      if (!editor) return;
      editor.querySelectorAll('input[type="checkbox"]:not([aria-label])').forEach(box => {
        box.setAttribute('aria-label', 'Tandai selesai');
      });
    }

    function updateEditorMetrics() {
      const editor = document.getElementById('editor-content-editable');
      const wordNode = document.getElementById('editor-word-count');
      const charNode = document.getElementById('editor-char-count');
      const taskNode = document.getElementById('editor-task-count');
      if (!editor || !wordNode || !charNode) return;
      labelEditorCheckboxes(editor);
      const text = String(editor.innerText || editor.textContent || '').replace(/\u00a0/g, ' ').trim();
      const words = text ? text.split(/\s+/u).filter(Boolean).length : 0;
      const tasks = [...editor.querySelectorAll('input[type="checkbox"]')];
      const completedTasks = tasks.filter(task => task.checked).length;
      wordNode.textContent = words.toLocaleString('id-ID') + ' kata';
      charNode.textContent = text.length.toLocaleString('id-ID') + ' karakter';
      if (taskNode) taskNode.textContent = completedTasks.toLocaleString('id-ID') + '/' + tasks.length.toLocaleString('id-ID') + ' tugas';
    }

    function captureEditorSelection() {
      const editor = document.getElementById('editor-content-editable');
      const selection = window.getSelection();
      if (!editor || !selection || !selection.rangeCount) return;
      const range = selection.getRangeAt(0);
      if (editor.contains(range.commonAncestorContainer)) savedEditorRange = range.cloneRange();
    }

    function restoreEditorSelection(editor) {
      if (!editor) return false;
      editor.focus({ preventScroll: true });
      if (!savedEditorRange || !editor.contains(savedEditorRange.commonAncestorContainer)) return false;
      const selection = window.getSelection();
      if (!selection) return false;
      try {
        selection.removeAllRanges();
        selection.addRange(savedEditorRange);
        return true;
      } catch (error) {
        return false;
      }
    }

    function insertEditorLink() {
      const editor = document.getElementById('editor-content-editable');
      if (!editor) return;
      const selection = window.getSelection();
      const savedRange = selection && selection.rangeCount ? selection.getRangeAt(0).cloneRange() : null;
      const rawUrl = prompt('Masukkan URL tautan (https://, http://, atau mailto:):');
      if (!rawUrl) { editor.focus(); return; }
      let safeUrl;
      try {
        const candidate = rawUrl.trim();
        if (!/^(https?:\/\/|mailto:)/i.test(candidate)) throw new Error('URL harus menyertakan skema yang diizinkan');
        safeUrl = new URL(candidate);
        if (!['http:', 'https:', 'mailto:'].includes(safeUrl.protocol)) throw new Error('Skema URL tidak diizinkan');
      } catch (error) {
        notify('URL tidak valid. Gunakan http://, https://, atau mailto:.');
        editor.focus();
        return;
      }
      editor.focus();
      if (savedRange && selection) {
        selection.removeAllRanges();
        selection.addRange(savedRange);
      }
      document.execCommand('createLink', false, safeUrl.href);
      updateToolbarState();
      updateEditorMetrics();
      scheduleEditorDraftSave();
    }

    document.querySelectorAll('.toolbar-btn').forEach(btn => {
      // Preserve the contenteditable range across mouse, pen and touch toolbar interactions.
      btn.addEventListener('pointerdown', captureEditorSelection);
      btn.addEventListener('mousedown', event => event.preventDefault());
      btn.addEventListener('click', function(event) {
        event.preventDefault();
        const cmd = this.getAttribute('data-command');
        const val = this.getAttribute('data-value') || null;
        const editor = document.getElementById('editor-content-editable');
        if (!editor) return;
        if (cmd === 'createLink') {
          restoreEditorSelection(editor);
          insertEditorLink();
          return;
        }
        restoreEditorSelection(editor);
        document.execCommand(cmd, false, val);
        updateToolbarState();
        updateEditorMetrics();
        scheduleEditorDraftSave();
      });
    });

    const editableArea = document.getElementById('editor-content-editable');
    if (editableArea) {
      editableArea.addEventListener('mouseup', () => { captureEditorSelection(); updateToolbarState(); });
      editableArea.addEventListener('keyup', () => { captureEditorSelection(); updateToolbarState(); updateEditorMetrics(); });
      // Activate the composer on pointer interaction as well as focus. Native
      // checklist inputs inside contenteditable can receive focus themselves,
      // so relying on the contenteditable focus event alone hides the dock.
      editableArea.addEventListener('pointerdown', () => {
        setEditorContentActive(true);
        syncEditorVisualViewport();
      }, { capture: true, passive: true });
      editableArea.addEventListener('focusin', () => {
        setEditorContentActive(true);
        updateToolbarState();
        syncEditorVisualViewport();
      });
      editableArea.addEventListener('focus', () => {
        setEditorContentActive(true);
        updateToolbarState();
        syncEditorVisualViewport();
      });
      editableArea.addEventListener('blur', event => {
        // Focus may move from contenteditable to a native checklist input nested
        // inside it, or to a toolbar button. Neither transition should hide dock.
        const nextTarget = event.relatedTarget;
        const dock = document.getElementById('editor-bottom-dock');
        if ((nextTarget && editableArea.contains(nextTarget)) ||
            (nextTarget && dock && dock.contains(nextTarget))) return;
        window.setTimeout(() => {
          const active = document.activeElement;
          if (editableArea.contains(active) || (dock && dock.contains(active))) return;
          setEditorContentActive(false);
        }, 0);
      });
      editableArea.addEventListener('input', () => {
        setEditorContentActive(true);
        updateEditorMetrics();
        syncEditorVisualViewport();
      });
      editableArea.addEventListener('change', event => {
        const checkbox = event.target.closest('input[type="checkbox"]');
        if (!checkbox || !editableArea.contains(checkbox)) return;
        if (checkbox.checked) checkbox.setAttribute('checked', '');
        else checkbox.removeAttribute('checked');
        scheduleEditorDraftSave();
        updateEditorMetrics();
      });
    }
    ['modal-title-input', 'modal-tags-input'].forEach(id => {
      const field = document.getElementById(id);
      if (field) field.addEventListener('focus', () => setEditorContentActive(false));
    });

    const insertChecklistButton = document.getElementById('insert-checklist-btn');
    insertChecklistButton.addEventListener('pointerdown', captureEditorSelection);
    insertChecklistButton.addEventListener('mousedown', event => event.preventDefault());
    insertChecklistButton.addEventListener('click', event => {
      event.preventDefault();
      restoreEditorSelection(document.getElementById('editor-content-editable'));
      insertEditorChecklist();
    });
    const mobileFormatButton = document.getElementById('mobile-open-formatting-btn');
    const mobileFormatBackButton = document.getElementById('mobile-format-back-btn');

    if (mobileFormatButton) {
      mobileFormatButton.addEventListener('pointerdown', captureEditorSelection);
      mobileFormatButton.addEventListener('mousedown', event => event.preventDefault());
      mobileFormatButton.addEventListener('click', event => {
      event.preventDefault();
      captureEditorSelection();
      setEditorFormattingMode(true);
      syncEditorVisualViewport();
      });
    }
    [mobileFormatBackButton].forEach(button => {
      if (!button) return;
      button.addEventListener('mousedown', event => event.preventDefault());
      button.addEventListener('click', event => {
        event.preventDefault();
        setEditorFormattingMode(false);
        const editor = document.getElementById('editor-content-editable');
        restoreEditorSelection(editor);
        syncEditorVisualViewport();
      });
    });
    const mobileTemplateButton = document.getElementById('mobile-open-template-btn');
    const mobileCategoryButton = document.getElementById('mobile-open-category-btn');
    const mobileContextBackButton = document.getElementById('mobile-context-back-btn');
    [mobileTemplateButton, mobileCategoryButton].forEach(button => {
      if (!button) return;
      button.addEventListener('mousedown', event => event.preventDefault());
      button.addEventListener('click', event => {
        event.preventDefault();
        captureEditorSelection();
        setEditorContentActive(true);
        setEditorPanelMode(button === mobileTemplateButton ? 'template' : 'category');
        syncEditorVisualViewport();
      });
    });
    if (mobileContextBackButton) mobileContextBackButton.addEventListener('click', event => {
      event.preventDefault();
      setEditorPanelMode('');
      restoreEditorSelection(document.getElementById('editor-content-editable'));
    });
    document.getElementById('editor-template-select').addEventListener('change', event => {
      applyProductivityTemplate(event.target.value);
      setEditorPanelMode('');
      restoreEditorSelection(document.getElementById('editor-content-editable'));
    });
    document.getElementById('modal-category-select').addEventListener('change', () => setEditorPanelMode(''));
    document.getElementById('manage-templates-btn').addEventListener('click', openTemplateManager);
    document.getElementById('close-template-manager-btn').addEventListener('click', closeTemplateManager);
    document.getElementById('cancel-template-manager-btn').addEventListener('click', closeTemplateManager);
    document.getElementById('template-manager-select').addEventListener('change', event => loadTemplateIntoManager(event.target.value));
    document.getElementById('new-template-btn').addEventListener('click', () => { clearTemplateManagerForm(); document.getElementById('template-name-input').focus(); });
    document.getElementById('save-template-btn').addEventListener('click', saveTemplateFromManager);
    document.getElementById('delete-template-btn').addEventListener('click', deleteTemplateFromManager);
    document.getElementById('reset-templates-btn').addEventListener('click', resetProductivityTemplates);
    document.getElementById('template-manager-modal').addEventListener('keydown', event => {
      if (event.key !== 'Tab') return;
      const modal = event.currentTarget;
      const focusable = [...modal.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [contenteditable="true"], [tabindex]:not([tabindex="-1"])')]
        .filter(element => element.getClientRects().length && element.getAttribute('aria-hidden') !== 'true');
      if (!focusable.length) {
        event.preventDefault();
        return;
      }
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && (document.activeElement === first || !modal.contains(document.activeElement))) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && (document.activeElement === last || !modal.contains(document.activeElement))) {
        event.preventDefault();
        first.focus();
      }
    });
    refreshProductivityTemplateOptions();

    function formatDate(isoString) {
      if (!isoString) return '-';
      const date = new Date(isoString);
      if (Number.isNaN(date.getTime())) return '-';
      return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function showLoader(message) {
      const loader = document.getElementById('global-loader');
      const text = document.getElementById('loader-text');
      if (text) text.textContent = message || 'Memproses...';
      if (loader) loader.classList.remove('opacity-0', 'pointer-events-none');
    }

    function hideLoader() {
      const loader = document.getElementById('global-loader');
      if (loader) loader.classList.add('opacity-0', 'pointer-events-none');
    }

    const QUEUE_KEY = 'hadi_keepflow_pending_v1';
    let pendingOperations = [];
    let syncRunning = false;
    let inFlightOperationId = null;
    let serverReady = false;
    let queueInitialized = false;
    let cloudLoadInProgress = false;
    let cloudLoadRequestId = 0;
    let refreshRequested = false;
    let retryTimer = null;
    const MAX_AUTO_RETRIES = 10;
    const MAX_RETRY_DELAY_MS = 5 * 60 * 1000;
    // Snapshot of the last UI state observed by syncToBackend().
    // This is deliberately separate from the last server response.
    let lastObservedNotes = [];

    function cloneData(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function createOperationId() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }
      return 'op_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    }

    function readQueue() {
      try {
        const value = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
        if (!Array.isArray(value)) {
          pendingOperations = [];
          return;
        }

        // Migrate the v1 queue format without discarding valid pending work.
        pendingOperations = value
          .filter(op => op && (op.type === 'save' || op.type === 'delete'))
          .map(op => {
            const rawId = op.id != null ? op.id : (op.note && op.note.id);
            const id = rawId == null ? '' : String(rawId);
            if (!id) return null;
            const normalized = {
              opId: op.opId || createOperationId(),
              type: op.type,
              id,
              queuedAt: op.queuedAt || new Date().toISOString(),
              attempts: Number(op.attempts) || 0,
              nextAttemptAt: op.nextAttemptAt || '',
              lastError: op.lastError || '',
              expectedUpdatedAt: op.expectedUpdatedAt || ''
            };
            if (op.conflict) normalized.conflict = op.conflict;
            if (op.type === 'save') {
              if (!op.note || typeof op.note !== 'object') return null;
              normalized.note = { ...op.note, id };
            }
            return normalized;
          })
          .filter(Boolean);
      } catch (e) {
        console.error('KeepFlow queue read error:', e);
        pendingOperations = [];
      }
    }

    // <notes-cache>
    // Local cache of all notes. Uses IndexedDB when available: no 5 MB limit, one
    // record per note, and only notes that changed are written. Falls back to
    // localStorage (the previous behaviour) when IndexedDB is missing, fails or
    // does not answer.
    //
    // It is only a cache. Unsynced edits are recorded in the pending-operation
    // queue (localStorage, written synchronously) and Drive is the source of
    // truth, so a failed or lost cache write never loses user data.
    const NotesCache = (() => {
      const DB_NAME = 'hadi_keepflow';
      const DB_VERSION = 1;
      const config = { openTimeoutMs: 4000 };
      const stats = { flushes: 0, puts: 0, deletes: 0 };
      const persisted = new Map();      // note id -> JSON of the record last written
      let persistedOrder = '';
      let db = null;
      let mode = 'unloaded';            // 'unloaded' | 'idb' | 'localstorage'
      let ready = false;
      let scheduled = false;
      let flushing = null;
      let again = false;
      let getNotes = () => [];
      let onError = () => {};

      const requestResult = request => new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });

      const transactionDone = transaction => {
        const done = new Promise((resolve, reject) => {
          transaction.oncomplete = () => resolve();
          transaction.onerror = event => reject((event && event.target && event.target.error) || transaction.error);
          transaction.onabort = () => reject(transaction.error || new Error('Transaksi IndexedDB dibatalkan'));
        });
        // A synchronous error while queueing requests (DataCloneError, an already
        // aborted transaction) can throw before the caller awaits `done`. Without
        // this no-op handler that later rejection would be reported as unhandled.
        done.catch(() => {});
        return done;
      };

      function openDatabase() {
        return new Promise((resolve, reject) => {
          if (typeof indexedDB === 'undefined' || !indexedDB) {
            reject(new Error('IndexedDB tidak tersedia'));
            return;
          }
          let settled = false;
          const timer = setTimeout(() => {
            if (settled) return;
            settled = true;
            reject(new Error('IndexedDB tidak merespons'));
          }, config.openTimeoutMs);
          let request;
          try {
            request = indexedDB.open(DB_NAME, DB_VERSION);
          } catch (error) {
            clearTimeout(timer);
            reject(error);
            return;
          }
          request.onupgradeneeded = () => {
            const database = request.result;
            if (!database.objectStoreNames.contains('notes')) database.createObjectStore('notes');
            if (!database.objectStoreNames.contains('meta')) database.createObjectStore('meta');
          };
          request.onsuccess = () => {
            clearTimeout(timer);
            if (settled) { request.result.close(); return; }
            settled = true;
            resolve(request.result);
          };
          request.onerror = () => {
            clearTimeout(timer);
            if (settled) return;
            settled = true;
            reject(request.error);
          };
        });
      }

      function readLocalStorage() {
        try {
          const value = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null');
          return Array.isArray(value) ? value : null;
        } catch {
          return null;
        }
      }

      function writeLocalStorage() {
        try {
          localStorage.setItem(LOCAL_KEY, JSON.stringify(getNotes()));
        } catch (error) {
          onError(error);
        }
      }

      const validRecord = value => value && typeof value === 'object' && !Array.isArray(value);

      // Order matters until the first cloud refresh, so it is stored explicitly
      // (IndexedDB returns records sorted by key).
      function sortByOrder(keys, values, order) {
        const position = new Map((Array.isArray(order) ? order : []).map((id, index) => [id, index]));
        return keys
          .map((key, index) => ({ key: String(key), value: values[index] }))
          .filter(item => validRecord(item.value))
          .sort((a, b) => (position.has(a.key) ? position.get(a.key) : Infinity) - (position.has(b.key) ? position.get(b.key) : Infinity));
      }

      function remember(items) {
        persisted.clear();
        items.forEach(item => persisted.set(item.key, JSON.stringify(item.value)));
        persistedOrder = JSON.stringify(items.map(item => item.key));
      }

      // Move the old localStorage cache into IndexedDB in ONE transaction, verify
      // the count, and only then drop the old copy.
      async function migrateFromLocalStorage(legacy) {
        const unique = new Map();
        legacy.forEach(note => {
          if (validRecord(note) && note.id != null) unique.set(String(note.id), note);
        });
        const transaction = db.transaction(['notes', 'meta'], 'readwrite');
        const done = transactionDone(transaction);
        const store = transaction.objectStore('notes');
        unique.forEach((note, id) => store.put(note, id));
        transaction.objectStore('meta').put([...unique.keys()], 'order');
        transaction.objectStore('meta').put(true, 'migrated');
        await done;
        const count = await requestResult(db.transaction('notes', 'readonly').objectStore('notes').count());
        if (count !== unique.size) throw new Error('Verifikasi migrasi cache gagal');
        try { localStorage.removeItem(LOCAL_KEY); } catch { /* harmless: stale copy is ignored */ }
        remember([...unique.entries()].map(([key, value]) => ({ key, value })));
        return [...unique.values()];
      }

      async function loadFromIndexedDb() {
        const transaction = db.transaction(['notes', 'meta'], 'readonly');
        const notesStore = transaction.objectStore('notes');
        const metaStore = transaction.objectStore('meta');
        const [keys, values, migrated, order] = await Promise.all([
          requestResult(notesStore.getAllKeys()),
          requestResult(notesStore.getAll()),
          requestResult(metaStore.get('migrated')),
          requestResult(metaStore.get('order'))
        ]);
        const items = sortByOrder(keys, values, order);
        const legacy = readLocalStorage();

        if (!migrated && !items.length && legacy && legacy.length) {
          return migrateFromLocalStorage(legacy);
        }
        // IndexedDB wins from here on: mark it, and drop any stale localStorage
        // copy (for example left by an older app version). The cache is never
        // merged; Drive and the pending queue are the source of truth.
        if (!migrated) db.transaction('meta', 'readwrite').objectStore('meta').put(true, 'migrated');
        if (legacy) {
          try { localStorage.removeItem(LOCAL_KEY); } catch { /* ignore */ }
        }
        remember(items);
        return items.map(item => item.value);
      }

      function useLocalStorage() {
        if (db) { try { db.close(); } catch { /* ignore */ } }
        db = null;
        mode = 'localstorage';
      }

      async function load() {
        let list = null;
        try {
          db = await openDatabase();
          db.onversionchange = () => useLocalStorage();
          mode = 'idb';
          list = await loadFromIndexedDb();
        } catch (error) {
          console.warn('KeepFlow: IndexedDB tidak dipakai, kembali ke localStorage:', error);
          useLocalStorage();
          list = null;
        }
        if (mode === 'localstorage') list = readLocalStorage() || [];
        ready = true;
        return list;
      }

      async function writeDifferences() {
        const entries = [];
        const order = [];
        const seen = new Set();
        getNotes().forEach(note => {
          if (!validRecord(note) || note.id == null) return;
          const id = String(note.id);
          if (seen.has(id)) return;
          seen.add(id);
          order.push(id);
          const json = JSON.stringify(note);
          if (persisted.get(id) !== json) entries.push([id, note, json]);
        });
        const removed = [];
        persisted.forEach((json, id) => { if (!seen.has(id)) removed.push(id); });
        const orderJson = JSON.stringify(order);
        if (!entries.length && !removed.length && orderJson === persistedOrder) return;

        const transaction = db.transaction(['notes', 'meta'], 'readwrite');
        const done = transactionDone(transaction);
        const store = transaction.objectStore('notes');
        entries.forEach(([id, note]) => store.put(note, id));
        removed.forEach(id => store.delete(id));
        if (orderJson !== persistedOrder) transaction.objectStore('meta').put(order, 'order');
        await done;

        entries.forEach(([id, note, json]) => persisted.set(id, json));
        removed.forEach(id => persisted.delete(id));
        persistedOrder = orderJson;
        stats.flushes += 1;
        stats.puts += entries.length;
        stats.deletes += removed.length;
      }

      function flush() {
        if (mode !== 'idb' || !db) return Promise.resolve();
        if (flushing) { again = true; return flushing; }
        flushing = (async () => {
          try {
            do {
              again = false;
              await writeDifferences();
            } while (again);
          } catch (error) {
            // Nothing was marked as persisted, so the next save() retries.
            onError(error);
          } finally {
            flushing = null;
          }
        })();
        return flushing;
      }

      // Called after every change. Nothing is written until load() has finished,
      // otherwise an empty in-memory list would wipe the stored cache.
      function save() {
        if (!ready) return;
        if (mode === 'localstorage') { writeLocalStorage(); return; }
        if (mode !== 'idb' || scheduled) return;
        scheduled = true;
        Promise.resolve().then(() => { scheduled = false; return flush(); });
      }

      // For pagehide/visibilitychange: start writing right now.
      function flushNow() {
        if (!ready) return Promise.resolve();
        if (mode === 'localstorage') { writeLocalStorage(); return Promise.resolve(); }
        scheduled = false;
        return flush();
      }

      return {
        init(options) {
          if (options && typeof options.getNotes === 'function') getNotes = options.getNotes;
          if (options && typeof options.onError === 'function') onError = options.onError;
        },
        load, save, flush, flushNow, config, stats,
        get mode() { return mode; }
      };
    })();
    // </notes-cache>

    let notesCacheLoaded = false;
    let notesCacheLoading = false;
    NotesCache.init({
      getNotes: () => notes,
      onError: error => {
        console.error('KeepFlow local cache error:', error);
        const full = error && (error.name === 'QuotaExceededError' || /quota/i.test(String(error.message || '')));
        setSyncStatus(full ? 'Penyimpanan perangkat penuh - cache lokal tidak diperbarui' : 'Gagal memperbarui cache lokal',
          'fa-triangle-exclamation', 'text-red-500');
      }
    });

    // If the cache lost a note that still has an unsynced save in the queue,
    // restore it from the queue so it stays visible before the next sync.
    function repairNotesFromQueue() {
      const known = new Set(notes.map(note => String(note.id)));
      pendingOperations.forEach(op => {
        if (!op || op.type !== 'save' || !op.note || typeof op.note !== 'object' || known.has(String(op.id))) return;
        notes.push(normalizeNoteRecord({ ...cloneData(op.note), id: op.id }));
        known.add(String(op.id));
      });
    }

    function persistLocal() {
      let queueSaved = false;
      try {
        // Persist the queue first: it is the recovery log for cloud operations.
        localStorage.setItem(QUEUE_KEY, JSON.stringify(pendingOperations));
        queueSaved = true;
      } catch (e) {
        console.error('KeepFlow queue persistence error:', e);
        setSyncStatus('Gagal menyimpan antrean lokal', 'fa-triangle-exclamation', 'text-red-500');
      }

      updateQueueIndicator();
      // The notes cache is best effort: the queue above is the recovery log.
      NotesCache.save();
      return queueSaved;
    }

    function setSyncStatus(message, icon = 'fa-cloud', color = 'text-gray-400') {
      const el = document.getElementById('sync-status');
      if (el) {
        el.innerHTML = `<i class="fa-solid ${icon} ${color}"></i><span class="truncate">${escapeHTML(message)}</span>`;
        el.title = message;
      }
      updateQueueIndicator();
    }

    function updateQueueIndicator() {
      const indicator = document.getElementById('sync-queue-count');
      if (!indicator) return;
      const count = pendingOperations.length;
      indicator.textContent = `${count} tertunda`;
      indicator.classList.toggle('hidden', count === 0);
    }

    function showManualRetry(show) {
      const button = document.getElementById('retry-sync');
      if (button) button.classList.toggle('hidden', !show);
    }

    function clearRetryTimer() {
      if (retryTimer !== null) {
        clearTimeout(retryTimer);
        retryTimer = null;
      }
    }

    function getRetryDelay(attempts) {
      const base = Math.min(1000 * Math.pow(2, Math.max(0, attempts - 1)), MAX_RETRY_DELAY_MS);
      // Small jitter prevents synchronized retries across tabs/devices.
      return Math.round(base * (0.8 + Math.random() * 0.4));
    }

    function schedulePendingRetry() {
      clearRetryTimer();
      if (!pendingOperations.length || !navigator.onLine || !serverReady) return;
      const head = pendingOperations[0];
      if ((Number(head.attempts) || 0) >= MAX_AUTO_RETRIES) {
        showManualRetry(true);
        setSyncStatus(`Antrean tertahan setelah ${MAX_AUTO_RETRIES} percobaan. Periksa koneksi lalu coba lagi.`, 'fa-triangle-exclamation', 'text-amber-500');
        return;
      }
      const dueAt = head.nextAttemptAt ? new Date(head.nextAttemptAt).getTime() : Date.now();
      const waitMs = Math.max(0, dueAt - Date.now());
      showManualRetry(false);
      if (waitMs === 0) {
        flushPendingOperations();
        return;
      }
      setSyncStatus(`Sinkronisasi dicoba lagi dalam ${Math.ceil(waitMs / 1000)} detik`, 'fa-clock', 'text-amber-500');
      retryTimer = setTimeout(() => {
        retryTimer = null;
        flushPendingOperations();
      }, Math.min(waitMs, MAX_RETRY_DELAY_MS));
    }

    function recordOperationFailure(operation, error) {
      const failed = pendingOperations.find(op => op.opId === operation.opId);
      if (!failed) return;
      failed.attempts = (Number(failed.attempts) || 0) + 1;
      failed.lastError = String(error && (error.message || error) || 'Kesalahan tidak diketahui').slice(0, 300);
      if (failed.attempts < MAX_AUTO_RETRIES) {
        failed.nextAttemptAt = new Date(Date.now() + getRetryDelay(failed.attempts)).toISOString();
      } else {
        failed.nextAttemptAt = '';
      }
      persistLocal();
      schedulePendingRetry();
    }

    function enqueueOperation(type, noteOrId) {
      const rawId = type === 'delete'
        ? (noteOrId && typeof noteOrId === 'object' ? noteOrId.id : noteOrId)
        : (noteOrId && noteOrId.id);
      const id = rawId == null ? '' : String(rawId);
      if (!id) return;

      const operation = type === 'delete'
        ? {
            opId: createOperationId(),
            type: 'delete',
            id,
            queuedAt: new Date().toISOString(),
            attempts: 0,
            expectedUpdatedAt: typeof noteOrId === 'object' ? (noteOrId.baseUpdatedAt || '') : ''
          }
        : {
            opId: createOperationId(),
            type: 'save',
            id,
            // Snapshot is immutable after enqueue; later edits create a new operation.
            note: cloneData({ ...noteOrId, id }),
            queuedAt: new Date().toISOString(),
            attempts: 0
          };

      // Keep the in-flight head untouched. Coalesce only operations that have
      // not been sent yet, so the latest pending action for this note wins.
      pendingOperations = pendingOperations.filter(op =>
        op.opId === inFlightOperationId || String(op.id) !== id
      );
      pendingOperations.push(operation);

      if (persistLocal()) flushPendingOperations();
    }

    function replaceTemporaryId(oldId, savedNote, acknowledgedOperationId) {
      const oldKey = String(oldId);
      const newKey = String(savedNote.id);

      // Advance the cloud baseline and replace temporary identity when needed.
      // Preserve current local fields because the user may have edited meanwhile.
      notes = notes.map(note => {
        if (String(note.id) !== oldKey) return note;
        const localCategory = normalizeNoteCategory(note.category);
        const savedCategory = normalizeNoteCategory(savedNote.category);
        return {
          ...note,
          id: newKey,
          // Adopt the Drive's canonical category casing only when the local
          // category still matches the acknowledged operation. A newer local
          // category change must remain untouched.
          category: localCategory.toLocaleLowerCase() === savedCategory.toLocaleLowerCase()
            ? savedCategory
            : note.category,
          baseUpdatedAt: savedNote.baseUpdatedAt || savedNote.updatedAt
        };
      });

      lastObservedNotes = lastObservedNotes.map(note => {
        if (String(note.id) !== oldKey) return note;
        const localCategory = normalizeNoteCategory(note.category);
        const savedCategory = normalizeNoteCategory(savedNote.category);
        return {
          ...note,
          id: newKey,
          category: localCategory.toLocaleLowerCase() === savedCategory.toLocaleLowerCase()
            ? savedCategory
            : note.category,
          baseUpdatedAt: savedNote.baseUpdatedAt || savedNote.updatedAt
        };
      });

      // Advance the baseline for later queued operations on the same note.
      // Preserve each operation's content snapshot; update only its identity/version.
      pendingOperations = pendingOperations.map(op => {
        if (op.opId === acknowledgedOperationId || String(op.id) !== oldKey) return op;
        if (op.type === 'delete') {
          return { ...op, id: newKey, expectedUpdatedAt: savedNote.baseUpdatedAt || savedNote.updatedAt };
        }
        return {
          ...op,
          id: newKey,
          note: { ...op.note, id: newKey, baseUpdatedAt: savedNote.baseUpdatedAt || savedNote.updatedAt }
        };
      });

      persistLocal();
      render();
    }

    function resolveSyncConflict(operation, response) {
      const currentNote = response.currentNote ? normalizeNoteRecord(response.currentNote) : null;
      const id = String(operation.id);
      const message = currentNote
        ? 'Versi catatan di Google Drive berbeda dari versi lokal.\n\n' +
          'OK: pertahankan versi lokal dan timpa versi cloud (keputusan manual).\n' +
          'Cancel: buang perubahan lokal tertunda dan gunakan versi cloud.'
        : operation.type === 'save'
          ? 'Catatan yang menjadi dasar perubahan sudah tidak ada atau tidak dapat diakses di Google Drive.\n\n' +
            'OK: simpan salinan lokal sebagai catatan baru.\n' +
            'Cancel: buang perubahan lokal tertunda.'
          : 'Catatan sudah tidak ditemukan di Google Drive. Penghapusan dianggap selesai.';
      const keepLocal = confirm(message);

      if (keepLocal) {
        if (currentNote) {
          pendingOperations = pendingOperations.map(op => {
            if (String(op.id) !== id) return op;
            const next = { ...op, conflict: null, attempts: 0 };
            if (next.type === 'save') {
              next.note = { ...next.note, baseUpdatedAt: currentNote.baseUpdatedAt };
            } else {
              next.expectedUpdatedAt = currentNote.baseUpdatedAt;
            }
            return next;
          });
          notes = notes.map(note => String(note.id) === id
            ? { ...note, baseUpdatedAt: currentNote.baseUpdatedAt }
            : note);
          lastObservedNotes = lastObservedNotes.map(note => String(note.id) === id
            ? { ...note, baseUpdatedAt: currentNote.baseUpdatedAt }
            : note);
        } else {
          // The cloud copy disappeared. Recreate a local save under a new ID;
          // a pending delete is already satisfied by the missing cloud file.
          const localNote = notes.find(note => String(note.id) === id);
          pendingOperations = pendingOperations.filter(op => String(op.id) !== id);
          if (operation.type === 'save' && localNote) {
            const newId = 'temp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
            const recreated = { ...localNote, id: newId, baseUpdatedAt: undefined };
            notes = notes.map(note => String(note.id) === id ? recreated : note);
            lastObservedNotes = lastObservedNotes.filter(note => String(note.id) !== id);
            enqueueOperation('save', recreated);
          }
        }
        setSyncStatus('Konflik: versi lokal dipilih secara manual', 'fa-triangle-exclamation', 'text-amber-500');
      } else {
        pendingOperations = pendingOperations.filter(op => String(op.id) !== id);
        if (currentNote) {
          notes = notes.map(note => String(note.id) === id ? currentNote : note);
          if (!notes.some(note => String(note.id) === id)) notes.push(currentNote);
          lastObservedNotes = lastObservedNotes.map(note => String(note.id) === id ? currentNote : note);
          if (!lastObservedNotes.some(note => String(note.id) === id)) lastObservedNotes.push(currentNote);
        } else {
          notes = notes.filter(note => String(note.id) !== id);
          lastObservedNotes = lastObservedNotes.filter(note => String(note.id) !== id);
        }
        setSyncStatus('Konflik diselesaikan: menggunakan versi cloud', 'fa-cloud', 'text-green-600');
      }

      persistLocal();
      render();
    }

    function flushPendingOperations() {
      if (syncRunning) return;

      if (cloudLoadInProgress) {
        setSyncStatus('Memperbarui data cloud sebelum sinkronisasi...', 'fa-circle-notch fa-spin', 'text-blue-500');
        return;
      }

      if (!navigator.onLine) {
        setSyncStatus('Offline - perubahan masuk antrean', 'fa-triangle-exclamation', 'text-amber-500');
        return;
      }

      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        setSyncStatus('Mode lokal - Google Apps Script tidak tersedia', 'fa-database', 'text-blue-500');
        return;
      }

      // Wait until the initial cloud snapshot has completed. Operations may be
      // queued before this point, but must not race the initial reconciliation.
      if (!serverReady) {
        setSyncStatus('Antrean tersimpan - menunggu data cloud', 'fa-database', 'text-blue-500');
        return;
      }

      if (!pendingOperations.length) {
        clearRetryTimer();
        showManualRetry(false);
        setSyncStatus('Tersinkron dengan Google Drive', 'fa-cloud', 'text-green-500');
        return;
      }

      const head = pendingOperations[0];
      if ((Number(head.attempts) || 0) >= MAX_AUTO_RETRIES) {
        showManualRetry(true);
        setSyncStatus(`Antrean tertahan setelah ${MAX_AUTO_RETRIES} percobaan. Periksa koneksi lalu coba lagi.`, 'fa-triangle-exclamation', 'text-amber-500');
        return;
      }
      if (head.nextAttemptAt && new Date(head.nextAttemptAt).getTime() > Date.now()) {
        schedulePendingRetry();
        return;
      }
      clearRetryTimer();
      showManualRetry(false);
      const queuedHead = pendingOperations[0];
      const operation = cloneData(queuedHead);
      syncRunning = true;
      inFlightOperationId = operation.opId;
      setSyncStatus('Menyinkronkan perubahan...', 'fa-circle-notch fa-spin', 'text-blue-500');

      const runner = google.script.run
        .withSuccessHandler(response => {
          if (response && response.status === 'conflict') {
            syncRunning = false;
            inFlightOperationId = null;
            resolveSyncConflict(operation, response);
            flushPendingOperations();
            return;
          }

          const validSaveResponse = operation.type !== 'save' ||
            (response && response.note && response.note.id);
          if (!response || response.status !== 'success' || !validSaveResponse) {
            syncRunning = false;
            inFlightOperationId = null;
            recordOperationFailure(operation, 'Respons server tidak valid atau operasi gagal.');
            if (refreshRequested) {
              refreshRequested = false;
              loadInitialData();
            }
            return;
          }

          if (operation.type === 'save' && response.note && response.note.id) {
            replaceTemporaryId(operation.id, response.note, operation.opId);
          } else if (operation.type === 'delete') {
            // The local delete already happened. Keep this defensive cleanup
            // for operations restored from an older queue.
            notes = notes.filter(note => String(note.id) !== String(operation.id));
            lastObservedNotes = lastObservedNotes.filter(note => String(note.id) !== String(operation.id));
          }

          // Acknowledge by operation ID, never by blindly shifting the queue.
          pendingOperations = pendingOperations.filter(op => op.opId !== operation.opId);
          persistLocal();
          clearRetryTimer();

          syncRunning = false;
          inFlightOperationId = null;
          render();
          if (refreshRequested) {
            refreshRequested = false;
            loadInitialData();
          } else {
            flushPendingOperations();
          }
        })
        .withFailureHandler(error => {
          syncRunning = false;
          inFlightOperationId = null;
          recordOperationFailure(operation, error);
          console.error('KeepFlow sync error:', error);
          if (refreshRequested) {
            refreshRequested = false;
            loadInitialData();
          }
        });

      if (operation.type === 'delete') runner.deleteNote(operation.id, operation.expectedUpdatedAt, operation.opId);
      else runner.saveNote(operation.note, operation.opId);
    }

    // ---------------------------------------------------------------------
    // Delta loading. Instead of downloading every note on each refresh, tell the
    // server which notes this browser already holds; the server answers with a
    // stub { id, unchanged: true } for those (see getNotesDelta in NotesApi.gs).
    //
    // Only notes WITHOUT pending local operations may be claimed: those equal
    // the cloud baseline. The claim is [baseUpdatedAt, category, title,
    // content.length]; the server must match all four or it sends the note.
    // ---------------------------------------------------------------------
    function buildDeltaBaseline() {
      const queued = new Set(pendingOperations.map(op => String(op.id)));
      const known = {};
      const baseline = new Map();
      notes.forEach(note => {
        const id = String(note.id);
        if (queued.has(id) || !note.baseUpdatedAt || typeof note.baseUpdatedAt !== 'string' ||
            typeof note.title !== 'string' || typeof note.content !== 'string') return;
        known[id] = [note.baseUpdatedAt, note.category || '', note.title, note.content.length];
        baseline.set(id, cloneData(note));
      });
      return { known, baseline };
    }

    // Rebuild exactly the array getNotes() would have returned, or null when the
    // response cannot be trusted (the caller then falls back to a full load).
    function assembleDeltaNotes(response, baseline) {
      if (!response || response.format !== 1 || !Array.isArray(response.notes)) return null;
      const result = [];
      for (const item of response.notes) {
        if (!item || typeof item !== 'object') return null;
        if (item.unchanged === true) {
          const held = baseline.get(String(item.id));
          if (!held) return null;
          result.push(cloneData(held));
        } else {
          result.push(item);
        }
      }
      return result;
    }

    function loadInitialData() {
      loadCategoryState();
      // Never reconcile a cloud snapshot while a write is in flight. The
      // snapshot could predate that write and reintroduce stale data.
      if (syncRunning) {
        refreshRequested = true;
        return;
      }
      if (cloudLoadInProgress) {
        refreshRequested = true;
        return;
      }

      showLoader(serverReady ? 'Memperbarui data Hadi KeepFlow...' : 'Memuat data Hadi KeepFlow...');
      if (!queueInitialized) {
        readQueue();
        queueInitialized = true;
      }

      // The first call reads the local cache (asynchronously, IndexedDB) and then
      // calls this function again. Later calls reuse the in-memory notes, which
      // are always persisted after every change.
      if (!notesCacheLoaded) {
        if (notesCacheLoading) return;
        notesCacheLoading = true;
        NotesCache.load()
          .then(list => { notes = (Array.isArray(list) ? list : []).map(normalizeNoteRecord); })
          .catch(error => { console.error('KeepFlow cache load error:', error); notes = []; })
          .then(() => {
            repairNotesFromQueue();
            notesCacheLoaded = true;
            notesCacheLoading = false;
            loadInitialData();
          });
        return;
      }
      pruneLegacyDefaultCategoriesFromLocalState();

      // Capture local state before the request. Any edits/deletes made while
      // the request is pending are recorded in the durable queue by
      // syncToBackend() and are applied over the returned cloud baseline.
      lastObservedNotes = cloneData(notes);
      render();
      hideLoader();

      if (!navigator.onLine || typeof google === 'undefined' || !google.script || !google.script.run) {
        serverReady = false;
        setSyncStatus('Mode lokal - menunggu koneksi', 'fa-database', 'text-blue-500');
        return;
      }

      const wasServerReady = serverReady;
      serverReady = false;
      cloudLoadInProgress = true;
      const requestId = ++cloudLoadRequestId;

      const handleServerData = serverData => {
        if (requestId !== cloudLoadRequestId) return;
        cloudLoadInProgress = false;

        if (!Array.isArray(serverData)) {
          serverReady = wasServerReady;
          setSyncStatus('Respons server tidak valid - data lokal dipertahankan', 'fa-triangle-exclamation', 'text-amber-500');
          if (refreshRequested) {
            refreshRequested = false;
            loadInitialData();
          } else if (serverReady) {
            flushPendingOperations();
          }
          return;
        }

        serverReady = true;
        // Cloud is the baseline. Preserve local notes with pending saves,
        // and apply queued deletes as tombstones so they cannot reappear.
        const queuedSaves = new Set(pendingOperations
          .filter(op => op.type === 'save')
          .map(op => String(op.id)));
        const queuedDeletes = new Set(pendingOperations
          .filter(op => op.type === 'delete')
          .map(op => String(op.id)));
        const localPending = notes.filter(note => queuedSaves.has(String(note.id)));
        const merged = new Map(serverData.map(note => [String(note.id), normalizeNoteRecord(note)]));
        localPending.forEach(note => merged.set(String(note.id), normalizeNoteRecord(note)));

        notes = [...merged.values()].filter(note => !queuedDeletes.has(String(note.id)));

        // Do not treat the server response as a user edit. Pending operations
        // remain the authoritative record of local changes until acknowledged.
        lastObservedNotes = cloneData(notes);
        persistLocal();
        render();
        refreshCloudCategories();

        if (refreshRequested) {
          refreshRequested = false;
          loadInitialData();
        } else {
          flushPendingOperations();
        }
      };
      const handleLoadFailure = error => {
        if (requestId !== cloudLoadRequestId) return;
        cloudLoadInProgress = false;
        serverReady = wasServerReady;
        console.error('KeepFlow load error:', error);
        setSyncStatus('Gagal memuat cloud - data lokal dipertahankan', 'fa-triangle-exclamation', 'text-amber-500');
        if (refreshRequested) {
          refreshRequested = false;
          loadInitialData();
        } else if (serverReady) {
          flushPendingOperations();
        }
      };
      const requestFullNotes = () => {
        google.script.run
          .withSuccessHandler(handleServerData)
          .withFailureHandler(handleLoadFailure)
          .getNotes();
      };

      // Prefer the delta request; any problem falls back to one full load.
      const { known, baseline } = buildDeltaBaseline();
      if (baseline.size === 0) {
        requestFullNotes();
        return;
      }
      google.script.run
        .withSuccessHandler(response => {
          if (requestId !== cloudLoadRequestId) return;
          const assembled = assembleDeltaNotes(response, baseline);
          if (assembled) handleServerData(assembled);
          else requestFullNotes();
        })
        .withFailureHandler(error => {
          if (requestId !== cloudLoadRequestId) return;
          console.warn('KeepFlow delta load failed, using full load:', error);
          requestFullNotes();
        })
        .getNotesDelta(known);
    }

    // Backward-compatible entry point used by existing UI actions.
    // It records deltas against the last observed UI snapshot, even while the
    // initial cloud request is still loading. The queue itself is durable.
    function syncToBackend() {
      const current = cloneData(notes);
      const currentMap = new Map(current.map(note => [String(note.id), note]));
      const previousMap = new Map(lastObservedNotes.map(note => [String(note.id), note]));

      current.forEach(note => {
        const old = previousMap.get(String(note.id));
        if (!old || JSON.stringify(old) !== JSON.stringify(note)) {
          enqueueOperation('save', note);
        }
      });

      lastObservedNotes.forEach(old => {
        if (!currentMap.has(String(old.id))) enqueueOperation('delete', old);
      });

      lastObservedNotes = current;
      persistLocal();
      flushPendingOperations();
    }

    // Keep the editor exactly as tall as the area the user can actually see, so
    // the bottom dock (an in-flow flex child of the modal) always sits directly
    // above the virtual keyboard.
    //
    // Two keyboard behaviours exist and both are handled:
    //  1. "resizes-content" (Android Chrome with the viewport meta set in Code.gs,
    //     Firefox, older Chrome): the layout viewport itself shrinks, so
    //     window.innerHeight is already the visible height.
    //  2. "overlay" (iOS Safari, Chrome with resizes-visual): the layout viewport
    //     keeps its size and only visualViewport shrinks/moves.
    // Taking the smaller of the two heights and following visualViewport.offsetTop
    // covers both without double-counting the keyboard.
    function syncEditorVisualViewport() {
      if (!editorModal || editorModal.classList.contains('hidden')) return;
      if (!window.matchMedia('(max-width: 767px)').matches) {
        ['--keepflow-visual-height', '--keepflow-visual-offset-top'].forEach(name => editorModal.style.removeProperty(name));
        return;
      }

      const viewport = window.visualViewport;
      const layoutHeight = window.innerHeight || document.documentElement.clientHeight || 0;
      let visibleHeight = layoutHeight;
      let visibleTop = 0;
      if (viewport) {
        // visualViewport.height is only trustworthy when it is non-zero.
        if (viewport.height > 0) visibleHeight = Math.min(layoutHeight || viewport.height, viewport.height);
        visibleTop = Math.max(0, viewport.offsetTop || 0);
      }
      visibleHeight = Math.max(240, visibleHeight);

      editorModal.style.setProperty('--keepflow-visual-height', Math.round(visibleHeight) + 'px');
      editorModal.style.setProperty('--keepflow-visual-offset-top', Math.round(visibleTop) + 'px');
    }

    // When the visible area changes (keyboard opened/closed, dock panel switched),
    // keep the caret from being hidden under the dock.
    function keepEditorCaretVisible() {
      const selection = window.getSelection && window.getSelection();
      const editableEl = document.getElementById('editor-content-editable');
      if (!selection || !selection.rangeCount || !editableEl || !editableEl.contains(selection.anchorNode)) return;
      const body = editorModal.querySelector('.editor-modal-body');
      if (!body) return;
      let rect = selection.getRangeAt(0).getBoundingClientRect();
      if (!rect || (!rect.width && !rect.height && !rect.top)) {
        const node = selection.anchorNode.nodeType === 1 ? selection.anchorNode : selection.anchorNode.parentElement;
        if (!node) return;
        rect = node.getBoundingClientRect();
      }
      const bodyRect = body.getBoundingClientRect();
      const margin = 24;
      if (rect.bottom > bodyRect.bottom - margin) body.scrollTop += rect.bottom - bodyRect.bottom + margin;
      else if (rect.top < bodyRect.top + margin) body.scrollTop -= bodyRect.top + margin - rect.top;
    }
    if (typeof ResizeObserver !== 'undefined') {
      let lastBodyHeight = 0;
      const bodyEl = editorModal.querySelector('.editor-modal-body');
      if (bodyEl) {
        new ResizeObserver(() => {
          const h = Math.round(bodyEl.clientHeight);
          if (h === lastBodyHeight) return;
          const shrank = lastBodyHeight && h < lastBodyHeight;
          lastBodyHeight = h;
          if (shrank && document.activeElement && document.activeElement.id === 'editor-content-editable') {
            window.requestAnimationFrame(keepEditorCaretVisible);
          }
        }).observe(bodyEl);
      }
    }

    function setSidebarBodyLock(locked) {
      if (locked && !sidebarBodyLock) {
        const body = document.body;
        const properties = ['position', 'top', 'left', 'right', 'width', 'overflow', 'padding-right'];
        sidebarBodyLock = {
          scrollY: window.scrollY || window.pageYOffset || 0,
          styles: properties.map(name => [name, body.style.getPropertyValue(name), body.style.getPropertyPriority(name)])
        };
        const scrollbarGap = Math.max(0, window.innerWidth - document.documentElement.clientWidth);
        body.style.position = 'fixed';
        body.style.top = '-' + sidebarBodyLock.scrollY + 'px';
        body.style.left = '0';
        body.style.right = '0';
        body.style.width = '100%';
        body.style.overflow = 'hidden';
        if (scrollbarGap) body.style.paddingRight = (parseFloat(getComputedStyle(body).paddingRight) || 0) + scrollbarGap + 'px';
      } else if (!locked && sidebarBodyLock) {
        const lock = sidebarBodyLock;
        sidebarBodyLock = null;
        lock.styles.forEach(([name, value, priority]) => {
          if (value) document.body.style.setProperty(name, value, priority);
          else document.body.style.removeProperty(name);
        });
        window.scrollTo(0, lock.scrollY);
      }
    }

    // Convert note HTML to preview/search text.
    // SECURITY: DOMParser builds an inert document (no scripts, no image loads,
