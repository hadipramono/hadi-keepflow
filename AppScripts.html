    // this, even on a detached element: <img onerror> still fires there.
    const PLAIN_TEXT_BLOCK_TAGS = new Set(['P', 'DIV', 'LI', 'UL', 'OL', 'BLOCKQUOTE', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'HR', 'TR']);
    function htmlToPlainText(html) {
      const doc = new DOMParser().parseFromString(String(html || ''), 'text/html');
      let out = '';
      const walk = parent => {
        parent.childNodes.forEach(child => {
          if (child.nodeType === Node.TEXT_NODE) { out += child.nodeValue; return; }
          if (child.nodeType !== Node.ELEMENT_NODE) return;
          const tag = child.tagName;
          if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'TEMPLATE') return;
          if (tag === 'BR') { out += '\n'; return; }
          if (tag === 'INPUT') {
            if (String(child.getAttribute('type') || '').toLowerCase() === 'checkbox') {
              out += child.hasAttribute('checked') ? '\u2611 ' : '\u2610 ';
            }
            return;
          }
          const isBlock = PLAIN_TEXT_BLOCK_TAGS.has(tag);
          if (isBlock && out && !out.endsWith('\n')) out += '\n';
          walk(child);
          if (isBlock && out && !out.endsWith('\n')) out += '\n';
        });
      };
      walk(doc.body);
      return out.replace(/\u00a0/g, ' ').replace(/([\u2610\u2611])[ \t]+/g, '$1 ').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    }

    function getPlainText(note) {
      if (!note || typeof note !== 'object') return '';
      const source = typeof note.content === 'string' ? note.content : '';
      const cached = plainTextCache.get(note);
      if (cached && cached.source === source) return cached.text;

      const text = htmlToPlainText(source);
      plainTextCache.set(note, { source, text, lower: text.toLowerCase() });
      return text;
    }

    function getSearchableText(note) {
      const source = typeof note.content === 'string' ? note.content : '';
      const cached = plainTextCache.get(note);
      if (cached && cached.source === source) return cached;
      getPlainText(note);
      return plainTextCache.get(note);
    }

    function matchesDateFilter(noteDateStr) {
      if (datePreset === 'all') return true;
      if (!noteDateStr) return false;
      const noteDate = new Date(noteDateStr);
      noteDate.setHours(0, 0, 0, 0);
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      if (datePreset === 'today') return noteDate.getTime() === today.getTime();
      if (datePreset === '7days') {
        const limit = new Date(today);
        limit.setDate(limit.getDate() - 7);
        return noteDate >= limit && noteDate <= today;
      }
      if (datePreset === '30days') {
        const limit = new Date(today);
        limit.setDate(limit.getDate() - 30);
        return noteDate >= limit && noteDate <= today;
      }
      if (datePreset === 'custom') {
        if (!customStartDate && !customEndDate) return true;
        const start = customStartDate ? new Date(customStartDate) : new Date(0);
        start.setHours(0, 0, 0, 0);
        const end = customEndDate ? new Date(customEndDate) : new Date();
        end.setHours(23, 59, 59, 999);
        return noteDate >= start && noteDate <= end;
      }
      return true;
    }

    function getSearchTerms(query) {
      const terms = [];
      const pattern = /"([^"]+)"|(\S+)/g;
      let match;
      while ((match = pattern.exec(String(query || ''))) !== null) {
        const term = (match[1] || match[2] || '').trim().toLocaleLowerCase();
        if (term && !terms.includes(term)) terms.push(term);
      }
      return terms;
    }

    function noteSearchHaystack(note) {
      const title = String(note.title || '').toLocaleLowerCase();
      const content = getSearchableText(note).lower;
      const category = normalizeNoteCategory(note.category).toLocaleLowerCase();
      const tags = (Array.isArray(note.tags) ? note.tags : []).join(' ').toLocaleLowerCase();
      return [title, content, category, tags].join(' ');
    }

    function noteMatchesSearch(note, terms) {
      if (!terms.length) return true;
      const haystack = noteSearchHaystack(note);
      return terms.every(term => haystack.includes(term));
    }

    function compareNotes(a, b) {
      const aTitle = String(a.title || '').toLocaleLowerCase();
      const bTitle = String(b.title || '').toLocaleLowerCase();
      const aUpdated = Date.parse(a.updatedAt || a.createdAt || 0) || 0;
      const bUpdated = Date.parse(b.updatedAt || b.createdAt || 0) || 0;
      const aCreated = Date.parse(a.createdAt || a.updatedAt || 0) || 0;
      const bCreated = Date.parse(b.createdAt || b.updatedAt || 0) || 0;

      switch (sortMode) {
        case 'updated_asc': return aUpdated - bUpdated || aTitle.localeCompare(bTitle, 'id');
        case 'created_desc': return bCreated - aCreated || aTitle.localeCompare(bTitle, 'id');
        case 'created_asc': return aCreated - bCreated || aTitle.localeCompare(bTitle, 'id');
        case 'title_asc': return aTitle.localeCompare(bTitle, 'id', { numeric: true, sensitivity: 'base' });
        case 'title_desc': return bTitle.localeCompare(aTitle, 'id', { numeric: true, sensitivity: 'base' });
        case 'updated_desc':
        default: return bUpdated - aUpdated || aTitle.localeCompare(bTitle, 'id');
      }
    }

    function loadUserPreferences() {
      try {
        const saved = JSON.parse(localStorage.getItem(PREFERENCES_KEY) || '{}');
        userPreferences = {
          displayName: typeof saved.displayName === 'string' ? saved.displayName.slice(0, 40) : '',
          theme: ['system', 'light', 'dark'].includes(saved.theme) ? saved.theme : 'system',
          layout: saved.layout === 'list' ? 'list' : 'grid',
          sort: ['updated_desc', 'updated_asc', 'created_desc', 'created_asc', 'title_asc', 'title_desc'].includes(saved.sort) ? saved.sort : 'updated_desc'
        };
      } catch (error) {
        userPreferences = { displayName: '', theme: 'system', layout: 'grid', sort: 'updated_desc' };
      }
      isListView = userPreferences.layout === 'list';
      sortMode = userPreferences.sort;
      applyThemePreference();
      syncPreferenceControls();
    }

    function saveUserPreferences() {
      try { localStorage.setItem(PREFERENCES_KEY, JSON.stringify(userPreferences)); }
      catch (error) { console.warn('KeepFlow preferences could not be saved:', error); }
    }

    function applyThemePreference() {
      const dark = userPreferences.theme === 'dark' ||
        (userPreferences.theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      const icon = document.getElementById('theme-icon');
      if (icon) {
        icon.classList.toggle('fa-sun', dark);
        icon.classList.toggle('fa-moon', !dark);
      }
    }

    function syncPreferenceControls() {
      const theme = document.getElementById('settings-theme');
      const layout = document.getElementById('settings-layout');
      const sort = document.getElementById('settings-sort');
      const name = document.getElementById('settings-display-name');
      if (theme) theme.value = userPreferences.theme;
      if (layout) layout.value = userPreferences.layout;
      if (sort) sort.value = userPreferences.sort;
      if (name) name.value = userPreferences.displayName;
      const sortControl = document.getElementById('sort-notes-select');
      if (sortControl) sortControl.value = userPreferences.sort;
      const viewIcon = document.getElementById('view-mode-icon');
      if (viewIcon) viewIcon.className = isListView ? 'fa-solid fa-border-all text-lg' : 'fa-solid fa-list text-lg';
    }

    function openSettings() {
      syncPreferenceControls();
      const modal = document.getElementById('settings-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.getElementById('settings-display-name').focus();
    }

    function closeSettings() {
      const modal = document.getElementById('settings-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function saveSettingsFromForm() {
      userPreferences.displayName = String(document.getElementById('settings-display-name').value || '').trim().slice(0, 40);
      userPreferences.theme = document.getElementById('settings-theme').value;
      userPreferences.layout = document.getElementById('settings-layout').value === 'list' ? 'list' : 'grid';
      userPreferences.sort = document.getElementById('settings-sort').value;
      isListView = userPreferences.layout === 'list';
      sortMode = userPreferences.sort;
      saveUserPreferences();
      applyThemePreference();
      syncPreferenceControls();
      closeSettings();
      render();
    }

    function switchToNotes(filter = 'all') {
      activeSection = 'notes';
      currentFilter = filter;
      currentCategory = null;
      currentTag = null;
      closeSidebar();
      render();
    }

    function renderDashboard() {
      const active = notes.filter(note => !isArchivedNote(note));
      const archived = notes.filter(isArchivedNote);
      const pinned = active.filter(note => Boolean(note.isPinned));
      const today = new Date().toDateString();
      const updatedToday = active.filter(note => {
        const date = new Date(note.updatedAt || note.createdAt || 0);
        return !Number.isNaN(date.getTime()) && date.toDateString() === today;
      });
      const greetingHour = new Date().getHours();
      const greeting = greetingHour < 11 ? 'Selamat pagi' : greetingHour < 15 ? 'Selamat siang' : greetingHour < 18 ? 'Selamat sore' : 'Selamat malam';
      const name = userPreferences.displayName;
      document.getElementById('dashboard-greeting').textContent = greeting + (name ? ', ' + name : ', selamat datang kembali');
      document.getElementById('dashboard-title').textContent = 'Ruang kerja Anda';
      document.getElementById('dashboard-date').textContent = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      document.getElementById('dashboard-stat-active').textContent = active.length;
      document.getElementById('dashboard-stat-pinned').textContent = pinned.length;
      document.getElementById('dashboard-stat-today').textContent = updatedToday.length;
      document.getElementById('dashboard-stat-archive').textContent = archived.length;

      const recent = [...active].sort((a, b) => (Date.parse(b.updatedAt || b.createdAt || 0) || 0) - (Date.parse(a.updatedAt || a.createdAt || 0) || 0)).slice(0, 5);
      const recentContainer = document.getElementById('dashboard-recent-notes');
      recentContainer.innerHTML = recent.length ? recent.map(note => {
        const title = String(note.title || '').trim() || 'Tanpa Judul';
        const snippet = getPlainText(note).slice(0, 105);
        return `<button type="button" data-dashboard-note="${escapeHTML(String(note.id))}" class="w-full text-left flex items-start gap-3 p-3 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-800 transition border border-transparent hover:border-gray-100 dark:hover:border-gray-700"><span class="mt-0.5 text-blue-500"><i class="fa-regular fa-note-sticky"></i></span><span class="min-w-0 flex-1"><strong class="block text-sm text-gray-800 dark:text-gray-100 truncate">${escapeHTML(title)}</strong><span class="block text-xs text-gray-500 dark:text-gray-400 mt-1 line-clamp-2">${escapeHTML(snippet || 'Catatan kosong')}</span></span><span class="text-[10px] text-gray-400 whitespace-nowrap">${escapeHTML(formatDate(note.updatedAt || note.createdAt))}</span></button>`;
      }).join('') : '<p class="text-sm text-gray-400 px-2 py-3">Belum ada catatan. Buat catatan pertama Anda.</p>';

      const categoryCounts = new Map([...new Set([...DEFAULT_CATEGORIES, ...categories])]
        .filter(category => String(category).toLocaleLowerCase() !== 'umum')
        .map(category => [String(category), 0]));
      active.forEach(note => {
        if (isInboxNote(note)) return;
        const category = normalizeNoteCategory(note.category);
        if (category) categoryCounts.set(category, (categoryCounts.get(category) || 0) + 1);
      });
      const categoryRows = [...categoryCounts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6);
      const maxCount = Math.max(1, ...categoryRows.map(row => row[1]));
      document.getElementById('dashboard-category-count').textContent = categoryCounts.size;
      document.getElementById('dashboard-categories').innerHTML = categoryRows.length ? categoryRows.map(([category, count]) => `<button type="button" data-dashboard-category="${escapeHTML(category)}" class="w-full text-left"><span class="flex justify-between gap-2 text-xs mb-1"><span class="truncate text-gray-600 dark:text-gray-300">${escapeHTML(category)}</span><strong class="text-gray-500 dark:text-gray-400">${count}</strong></span><span class="block h-1.5 rounded-full bg-gray-100 dark:bg-gray-700 overflow-hidden"><span class="block h-full rounded-full bg-blue-500" style="width:${Math.round(count / maxCount * 100)}%"></span></span></button>`).join('') : '<p class="text-sm text-gray-400">Belum ada kategori.</p>';
    }

    function getFilteredNotes() {
      const terms = getSearchTerms(searchQuery);
      return notes.filter(note => {
        if (!noteMatchesSearch(note, terms)) return false;
        if (!matchesDateFilter(note.updatedAt)) return false;
        if (currentFilter === 'inbox') return isInboxNote(note) && !isArchivedNote(note);
        if (currentFilter === 'pinned') return note.isPinned && !isArchivedNote(note);
        if (currentFilter === 'archive') return isArchivedNote(note);
        if (currentCategory) return normalizeNoteCategory(note.category) === currentCategory && !isArchivedNote(note);
        if (currentTag) return note.tags && note.tags.includes(currentTag) && !isArchivedNote(note);
        return !isArchivedNote(note);
      }).sort(compareNotes);
    }

    function highlightSearchText(value, query) {
      const raw = String(value || '');
      const terms = getSearchTerms(query).sort((a, b) => b.length - a.length);
      if (!raw || !terms.length) return escapeHTML(raw);
      const pattern = new RegExp(terms.map(term => term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'gi');
      let output = '';
      let lastIndex = 0;
      let match;
      while ((match = pattern.exec(raw)) !== null) {
        output += escapeHTML(raw.slice(lastIndex, match.index));
        output += '<mark class="search-highlight">' + escapeHTML(match[0]) + '</mark>';
        lastIndex = match.index + match[0].length;
        if (!match[0].length) pattern.lastIndex++;
      }
      return output + escapeHTML(raw.slice(lastIndex));
    }

    function loadSearchHistory() {
      try {
        const stored = JSON.parse(localStorage.getItem(SEARCH_HISTORY_KEY) || '[]');
        recentSearches = Array.isArray(stored)
          ? stored.filter(value => typeof value === 'string' && value.trim()).slice(0, SEARCH_HISTORY_LIMIT)
          : [];
      } catch (error) {
        recentSearches = [];
      }
    }

    function saveSearchHistory() {
      const value = String(searchQuery || '').trim();
      if (value.length < 2) return;
      recentSearches = [value, ...recentSearches.filter(item => item.toLocaleLowerCase() !== value.toLocaleLowerCase())]
        .slice(0, SEARCH_HISTORY_LIMIT);
      try { localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(recentSearches)); }
      catch (error) { console.warn('KeepFlow search history could not be saved:', error); }
      renderRecentSearches();
    }

    function renderRecentSearches() {
      const list = document.getElementById('recent-search-list');
      if (!list) return;
      if (!recentSearches.length) {
        list.innerHTML = '<p class="px-3 py-3 text-xs text-gray-400">Belum ada pencarian tersimpan.</p>';
        document.getElementById('clear-search-history-btn').classList.add('hidden');
        return;
      }
      document.getElementById('clear-search-history-btn').classList.remove('hidden');
      list.innerHTML = recentSearches.map(term => `
        <button type="button" data-recent-search="${escapeHTML(term)}" class="w-full flex items-center gap-2 px-3 py-2.5 text-left text-sm text-gray-600 dark:text-gray-300">
          <i class="fa-solid fa-clock-rotate-left text-xs text-gray-400"></i>
          <span class="truncate">${escapeHTML(term)}</span>
        </button>
      `).join('');
    }

    function showRecentSearches() {
      renderRecentSearches();
      const panel = document.getElementById('recent-search-panel');
      panel.classList.remove('hidden');
    }

    function hideRecentSearches() {
      document.getElementById('recent-search-panel').classList.add('hidden');
    }

    function render() {
      const dashboardVisible = activeSection === 'dashboard';
      document.getElementById('dashboard-view').classList.toggle('hidden', !dashboardVisible);
      document.getElementById('notes-view-content').classList.toggle('hidden', dashboardVisible);
      document.getElementById('quick-add-trigger').classList.toggle('hidden', dashboardVisible);
      document.getElementById('dashboard-nav').classList.toggle('bg-blue-50', dashboardVisible);
      document.getElementById('dashboard-nav').classList.toggle('dark:bg-blue-900/30', dashboardVisible);
      document.getElementById('dashboard-nav').classList.toggle('text-blue-600', dashboardVisible);
      document.getElementById('dashboard-nav').classList.toggle('dark:text-blue-400', dashboardVisible);
      document.getElementById('dashboard-nav').classList.toggle('text-gray-600', !dashboardVisible);
      document.getElementById('dashboard-nav').classList.toggle('dark:text-gray-400', !dashboardVisible);
      if (dashboardVisible) document.getElementById('dashboard-nav').setAttribute('aria-current', 'page');
      else document.getElementById('dashboard-nav').removeAttribute('aria-current');
      // Dashboard statistics and recent-note previews are not visible in the
      // workspace view. Defer their O(n) aggregation until the dashboard opens.
      if (dashboardVisible) renderDashboard();
      const filtered = getFilteredNotes();
      const existingIds = new Set(notes.map(note => String(note.id)));
      [...selectedNoteIds].forEach(id => { if (!existingIds.has(id)) selectedNoteIds.delete(id); });
      updateActiveView(filtered.length);
      notesGrid.className = isListView ? 'view-list' : 'view-grid';
      pinnedGrid.className = isListView ? 'view-list' : 'view-grid';
      
      if (currentFilter === 'pinned' || currentFilter === 'inbox') {
        // Dedicated views show all matching notes without All Notes pin grouping.
        pinnedSection.classList.add('hidden');
        othersTitle.classList.add('hidden');
        notesGrid.innerHTML = filtered.map(createCardHTML).join('');
      } else if (currentCategory || currentTag) {
        // Category/tag views must include BOTH pinned and regular notes.
        // Pinning only changes grouping in the All Notes view; it must not
        // hide a note from its category or tag.
        pinnedSection.classList.add('hidden');
        othersTitle.classList.add('hidden');
        notesGrid.innerHTML = filtered.map(createCardHTML).join('');
      } else {
        const pinned = filtered.filter(n => n.isPinned && currentFilter !== 'archive');
        const others = filtered.filter(n => !n.isPinned || currentFilter === 'archive');

        if (pinned.length > 0 && currentFilter === 'all') {
          pinnedSection.classList.remove('hidden');
          othersTitle.classList.remove('hidden');
          pinnedGrid.innerHTML = pinned.map(createCardHTML).join('');
        } else {
          pinnedSection.classList.add('hidden');
          othersTitle.classList.add('hidden');
        }
        notesGrid.innerHTML = others.map(createCardHTML).join('');
      }

      renderInboxCount();
      renderCategories();
      renderTags();
      renderBulkActions(filtered);
    }

    function renderBulkActions(filteredNotes) {
      const bar = document.getElementById('bulk-actions-bar');
      const toggle = document.getElementById('toggle-selection-mode');
      const count = document.getElementById('bulk-selection-count');
      const categorySelect = document.getElementById('bulk-category-select');
      if (!bar || !toggle || !count || !categorySelect) return;
      bar.classList.toggle('hidden', !selectionMode);
      toggle.setAttribute('aria-pressed', String(selectionMode));
      toggle.classList.toggle('bg-blue-100', selectionMode);
      toggle.classList.toggle('dark:bg-blue-900/50', selectionMode);
      toggle.classList.toggle('text-blue-700', selectionMode);
      toggle.innerHTML = selectionMode
        ? '<i class="fa-solid fa-xmark mr-1"></i><span>Selesai</span>'
        : '<i class="fa-regular fa-square-check mr-1"></i><span>Pilih</span>';
      count.textContent = selectedNoteIds.size + ' catatan dipilih';
      const currentValue = categorySelect.value;
      const availableCategories = [...new Set([
        ...DEFAULT_CATEGORIES,
        ...categories,
        ...notes.map(note => normalizeNoteCategory(note.category)).filter(Boolean)
      ])].filter(category => category.toLocaleLowerCase() !== 'umum');
      categorySelect.innerHTML = '<option value="">Pilih tujuan...</option>' +
        '<option value="__inbox__">📥 Inbox</option>' +
        availableCategories.map(category =>
          '<option value="' + escapeHTML(category) + '">📁 ' + escapeHTML(category) + '</option>'
        ).join('');
      categorySelect.value = [...categorySelect.options].some(option => option.value === currentValue) ? currentValue : '';
      const selectedNotes = notes.filter(note => selectedNoteIds.has(String(note.id)));
      const allPinned = selectedNotes.length > 0 && selectedNotes.every(note => Boolean(note.isPinned));
      const allArchived = selectedNotes.length > 0 && selectedNotes.every(isArchivedNote);
      document.getElementById('bulk-toggle-pin').textContent = allPinned ? 'Lepas pin' : 'Sematkan';
      document.getElementById('bulk-toggle-archive').textContent = allArchived ? 'Pulihkan arsip' : 'Arsipkan';
      document.getElementById('bulk-move-category').disabled = !selectedNotes.length;
      document.getElementById('bulk-add-tags').disabled = !selectedNotes.length;
      document.getElementById('bulk-remove-tags').disabled = !selectedNotes.length;
      document.getElementById('bulk-toggle-pin').disabled = !selectedNotes.length;
      document.getElementById('bulk-toggle-archive').disabled = !selectedNotes.length;
      document.querySelectorAll('.note-select-checkbox').forEach(input => {
        input.checked = selectedNoteIds.has(String(input.dataset.noteId));
      });
      document.querySelectorAll('.card-item').forEach(card => {
        card.classList.toggle('note-selected', selectedNoteIds.has(String(card.dataset.id)));
      });
    }

    function applyBulkNoteUpdate(updater) {
      if (!selectedNoteIds.size) return 0;
      const timestamp = new Date().toISOString();
      let changed = 0;
      notes = notes.map(note => {
        if (!selectedNoteIds.has(String(note.id))) return note;
        const updated = updater({ ...note, updatedAt: timestamp });
        if (updated) changed++;
        return updated || note;
      });
      render();
      syncToBackend();
      return changed;
    }

    // Normalize legacy metadata values: the string "false" must not be
    // treated as truthy. Pinned notes remain active and count toward categories.
    function isArchivedNote(note) {
      const value = note && note.isArchived;
      return value === true || value === 1 ||
        (typeof value === 'string' && ['true', '1'].includes(value.trim().toLowerCase()));
    }

    // Inbox is represented by an empty category. "Umum" is accepted only as
    // a compatibility value for stale local drafts and older queued payloads.
    function isInboxNote(note) {
      return normalizeNoteCategory(note && note.category) === '';
    }

    function getCategoryDisplayName(category) {
      return normalizeNoteCategory(category) || 'Inbox';
    }

    function renderInboxCount() {
      const count = notes.filter(note => isInboxNote(note) && !isArchivedNote(note)).length;
      const badge = document.getElementById('inbox-count');
      if (badge) {
        badge.textContent = count > 99 ? '99+' : String(count);
        badge.setAttribute('aria-label', count + ' catatan di Inbox');
        badge.classList.toggle('hidden', count === 0);
      }
    }

    function renderCategories() {
      const categoryCounts = new Map();
      const activeCatsSet = new Set([...DEFAULT_CATEGORIES, ...categories].filter(cat =>
        String(cat).toLocaleLowerCase() !== 'umum'
      ));
      if (currentCategory && String(currentCategory).toLocaleLowerCase() !== 'umum') {
        activeCatsSet.add(currentCategory);
      }

      // Legacy "Umum" is represented by Inbox in the workspace navigation,
      // not as a regular category. Other categories retain their existing data.
      notes.forEach(note => {
        if (isInboxNote(note)) return;
        const category = normalizeNoteCategory(note.category);
        if (!category) return;
        activeCatsSet.add(category);
        categoryCounts.set(category, (categoryCounts.get(category) || 0) + 1);
      });
      const activeCats = [...activeCatsSet];

      categoriesList.innerHTML = activeCats.map(cat => `
        <div class="category-row group w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm ${currentCategory === cat ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-600 font-semibold' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700/50'} cursor-pointer">
          <button type="button" data-category="${escapeHTML(cat)}" ${currentCategory === cat ? 'aria-current="page"' : ''} class="category-select-btn flex items-center space-x-3 truncate flex-1 min-w-0 text-left rounded-lg focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500">
            <i class="fa-solid fa-folder text-xs"></i>
            <span class="truncate">${escapeHTML(cat)}</span>
          </button>
          <div class="category-management-actions flex items-center space-x-2">
            <span class="text-xs text-gray-400">${categoryCounts.get(cat) || 0}</span>
            <button data-old-category="${escapeHTML(cat)}" class="edit-category-btn text-gray-400 hover:text-blue-500 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition p-1" title="Ubah Nama Kategori" aria-label="Ubah kategori ${escapeHTML(cat)}"><i class="fa-solid fa-pen text-xs"></i></button>

    function hasUnsavedEditorChanges() {
      if (!editorModal || editorModal.classList.contains('hidden')) return false;

      if (!editorBaseline) return Boolean(title || content || tags.length);
      const baselineTags = normalizeTags(Array.isArray(editorBaseline.tags) ? editorBaseline.tags.join(', ') : '');
      return title !== String(editorBaseline.title || '').trim() ||
        content !== sanitizeEditorHTML(String(editorBaseline.content || '').trim()) ||
        category !== normalizeNoteCategory(editorBaseline.category) ||
        JSON.stringify(tags) !== JSON.stringify(baselineTags);

    function readEditorDraft() {
      try {
        const draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
        return draft && typeof draft === 'object' ? draft : null;

        console.warn('KeepFlow draft read error:', error);
        return null;
      }

    function persistEditorDraft() {
      if (!editorModal || editorModal.classList.contains('hidden')) return;
      try {
        localStorage.setItem(DRAFT_KEY, JSON.stringify(collectEditorDraft()));
        editorDraftDirty = false;
        setEditorDraftStatus('Draft tersimpan di perangkat ini', 'text-green-600 dark:text-green-400');
      } catch (error) {
        setEditorDraftStatus('Draft gagal disimpan lokal. Periksa kapasitas penyimpanan browser.', 'text-red-500');

      }

    function flushEditorDraftNow() {
      if (!editorDraftDirty) return;
      if (draftSaveTimer) clearTimeout(draftSaveTimer);
      draftSaveTimer = null;
      persistEditorDraft();

    function scheduleEditorDraftSave() {
      editorDraftDirty = true;
      setEditorDraftStatus('Ada perubahan — menyimpan draft lokal…', 'text-amber-600 dark:text-amber-400');
      if (draftSaveTimer) clearTimeout(draftSaveTimer);
      draftSaveTimer = setTimeout(() => {
        draftSaveTimer = null;
        persistEditorDraft();

      if (draftSaveTimer) clearTimeout(draftSaveTimer);

      return [...unique.values()].slice(0, 50);

        while (templates[key]) key = base + '-' + suffix++;

    // Keep editor HTML limited to formatting produced by the toolbar and safe links.
    // Pasted scripts, event attributes, styles and unsafe URL schemes are removed.
    function sanitizeEditorHTML(html) {
      const parser = new DOMParser();
      const parsed = parser.parseFromString(String(html || ''), 'text/html');
      const allowedTags = new Set(['P', 'DIV', 'BR', 'HR', 'STRONG', 'B', 'EM', 'I', 'U', 'S', 'STRIKE', 'H1', 'H2', 'UL', 'OL', 'LI', 'BLOCKQUOTE', 'A', 'INPUT', 'SPAN']);
      const cleanNode = node => {
        [...node.childNodes].forEach(child => {
          if (child.nodeType === Node.COMMENT_NODE) {
            child.remove();
            return;
          }
          if (child.nodeType !== Node.ELEMENT_NODE) return;
          if (!allowedTags.has(child.tagName)) {
            if (['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'SVG', 'MATH'].includes(child.tagName)) {
              child.remove();
            } else {
              cleanNode(child);
              child.replaceWith(...child.childNodes);
            }
            return;
          }
          const href = child.tagName === 'A' ? child.getAttribute('href') : null;
          const isCheckbox = child.tagName === 'INPUT' && String(child.getAttribute('type') || '').toLowerCase() === 'checkbox';
          const isChecked = isCheckbox && (child.checked || child.hasAttribute('checked'));
          const isChecklist = child.tagName === 'UL' && child.classList.contains('keepflow-checklist');
          [...child.attributes].forEach(attr => child.removeAttribute(attr.name));
          if (child.tagName === 'INPUT') {
            if (!isCheckbox) { child.remove(); return; }
            child.setAttribute('type', 'checkbox');
            if (isChecked) child.setAttribute('checked', '');
          }
          if (isChecklist) child.className = 'keepflow-checklist';
          if (child.tagName === 'A' && href) {
            try {
              const url = new URL(href, window.location.href);
              if (['http:', 'https:', 'mailto:'].includes(url.protocol)) {
                child.setAttribute('href', url.href);
                child.setAttribute('rel', 'noopener noreferrer');
                child.setAttribute('target', '_blank');
              }
            } catch (error) {}
          }
          cleanNode(child);
        });
      };
      cleanNode(parsed.body);
      return parsed.body.innerHTML;
    }

    function openEditor(noteId = null) {
      editorReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      activeNoteId = noteId;
      savedEditorRange = null;
      const modalTitle = document.getElementById('modal-title-input');
      const modalContentEditable = document.getElementById('editor-content-editable');
      const modalTags = document.getElementById('modal-tags-input');
      const metaCreated = document.getElementById('meta-created');
      const metaUpdated = document.getElementById('meta-updated');

      let currentNote = null;
      if (noteId !== null && noteId !== undefined && String(noteId) !== '') {
        currentNote = notes.find(n => String(n.id) === String(noteId));
      }
      editorBaseline = currentNote ? cloneData(currentNote) : null;
      const templateSelect = document.getElementById('editor-template-select');
      if (templateSelect) templateSelect.value = '';

      if (currentNote) {
        modalTitle.value = currentNote.title || '';
        modalContentEditable.innerHTML = sanitizeEditorHTML(currentNote.content || '');
        modalCategorySelect.value = normalizeNoteCategory(currentNote.category);
        modalTags.value = (currentNote.tags || []).join(', ');
        const timestampFallback = new Date().toISOString();
        const createdAt = currentNote.createdAt || currentNote.updatedAt || timestampFallback;
        const updatedAt = currentNote.updatedAt || currentNote.createdAt || timestampFallback;
        metaCreated.textContent = `Dibuat: ${formatDate(createdAt)}`;
        metaUpdated.textContent = `Diperbarui: ${formatDate(updatedAt)}`;
      } else {
        modalTitle.value = '';
        modalContentEditable.innerHTML = '';
        modalCategorySelect.value = normalizeNoteCategory(currentCategory);
        modalTags.value = '';
        const nowFormatted = formatDate(new Date().toISOString());
        metaCreated.textContent = `Dibuat: ${nowFormatted}`;
        metaUpdated.textContent = `Diperbarui: ${nowFormatted}`;
      }

      // Restore only a draft belonging to this exact note (or a new-note draft).
      const draft = readEditorDraft();
      const expectedDraftId = noteId ? String(noteId) : '__new__';
      if (draft && draft.noteId === expectedDraftId) {
        const draftIsStale = Boolean(currentNote && draft.baselineUpdatedAt &&
          currentNote.updatedAt && draft.baselineUpdatedAt !== currentNote.updatedAt);
        const prompt = draftIsStale
          ? 'Ada draft lokal dari versi catatan yang lebih lama. Pulihkan draft ini? Perubahan cloud yang lebih baru tidak akan dihapus sampai Anda menekan Simpan.'
          : 'Ditemukan draft lokal yang belum disimpan. Pulihkan draft?';
        if (confirm(prompt)) {
          modalTitle.value = String(draft.title || '');
          modalContentEditable.innerHTML = sanitizeEditorHTML(draft.content || '');
          modalCategorySelect.value = normalizeNoteCategory(draft.category);
          modalTags.value = String(draft.tagsText || '');
          setEditorDraftStatus('Draft lokal dipulihkan — periksa sebelum menyimpan.', 'text-amber-600 dark:text-amber-400');
        } else {
          clearEditorDraft();
          setEditorDraftStatus('Draft sebelumnya dibuang.', 'text-gray-400');
        }
      } else {
        setEditorDraftStatus('Perubahan akan disimpan sebagai draft lokal saat Anda mengetik.', 'text-gray-400');
      }

      editorDraftDirty = false;
      updateModalActionStates(currentNote);
      updateEditorMetrics();
      setEditorContentActive(false);
      setEditorPanelMode('');
      if (window.matchMedia('(max-width: 767px)').matches) moveEditorMetadataToDock();
      else restoreEditorMetadataPosition();
      closeMobileActionsMenu();
      editorModal.classList.remove('hidden');
      syncEditorVisualViewport();
      if (window.matchMedia('(min-width: 768px)').matches) {
        modalContentEditable.focus({ preventScroll: true });
      } else {
        document.getElementById('modal-close-btn').focus({ preventScroll: true });
      }
      updateToolbarState();
    }

    function saveActiveNote() {
      const title = document.getElementById('modal-title-input').value.trim();
      const content = sanitizeEditorHTML(document.getElementById('editor-content-editable').innerHTML.trim());
      const category = normalizeNoteCategory(modalCategorySelect.value).slice(0, 120);
      const tags = normalizeTags(document.getElementById('modal-tags-input').value);

      if (content.length > 500000) {
        notify('Isi catatan terlalu besar. Maksimal 500.000 karakter.');
        return;
      }
      if (title.length > 180) {
        notify('Judul terlalu panjang. Maksimal 180 karakter.');
        return;
      }
      if (!title && !content) {
        clearEditorDraft();
        closeEditorModal();
        editorModal.classList.remove('editor-content-active');
        editorModal.style.removeProperty('--keepflow-visual-height');
        editorModal.style.removeProperty('--keepflow-visual-offset-top');
        closeMobileActionsMenu();
        savedEditorRange = null;
        activeNoteId = null;
        return;
      }

      if (hasActiveNoteId()) {
        const saveTimestamp = new Date().toISOString();
        notes = notes.map(n => String(n.id) === String(activeNoteId) ? {
          ...n, title, content, category, tags,
          createdAt: n.createdAt || n.updatedAt || saveTimestamp,
          updatedAt: saveTimestamp
        } : n);
      } else {
        notes.unshift({
          id: 'temp_' + Date.now(),
          title, content, category,
          isPinned: false, isArchived: false,
          tags,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        });
      }

      clearEditorDraft();
      closeEditorModal();
      editorModal.classList.remove('editor-content-active');
      editorModal.style.removeProperty('--keepflow-visual-height');
      editorModal.style.removeProperty('--keepflow-visual-offset-top');
      closeMobileActionsMenu();
      savedEditorRange = null;
      activeNoteId = null;
      render();
      syncToBackend();
    }


    // ---------------------------------------------------------------------
    // Phase 3.1 — ZIP backup, restore, import preview, and duplicate checks
    // ---------------------------------------------------------------------
    const KEEPFLOW_BACKUP_FORMAT = 'hadi-keepflow-backup';
    const KEEPFLOW_BACKUP_SCHEMA = 2;
    const KEEPFLOW_BACKUP_SUPPORTED_SCHEMAS = [1, 2];
    const MAX_IMPORT_ZIP_BYTES = 25 * 1024 * 1024;
    const MAX_IMPORT_ENTRIES = 2000;
    const MAX_IMPORT_NOTE_BYTES = 500000;

    function callKeepFlowServer(method, ...args) {
      return new Promise((resolve, reject) => {
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          reject(new Error('Google Apps Script tidak tersedia.'));
          return;
        }
        const runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(error => reject(new Error(error && error.message ? error.message : String(error))));
        if (typeof runner[method] !== 'function') {
          reject(new Error('Fungsi server tidak tersedia: ' + method));
          return;
        }
        runner[method](...args);
      });
    }

    // ---------------------------------------------------------------------
    // Note file format v2 (YAML front matter + HTML body).
    // KEEP IN SYNC with NoteFormat.gs: tests/format-compat.test.js checks that
    // both implementations read each other's output.
    // ---------------------------------------------------------------------
    function yamlString(value) {
      return JSON.stringify(String(value == null ? '' : value))
        .replace(/\u2028/g, '\\u2028')
        .replace(/\u2029/g, '\\u2029');
    }

    function serializeNoteFile(meta, body) {
      const m = meta || {};
      const tags = (Array.isArray(m.tags) ? m.tags : [])
        .filter(tag => typeof tag === 'string')
        .map(yamlString)
        .join(', ');
      return [
        '---',
        'keepflow: 2',
        'title: ' + yamlString(m.title || ''),
        'created: ' + yamlString(m.createdAt || ''),
        'pinned: ' + (m.isPinned ? 'true' : 'false'),
        'archived: ' + (m.isArchived ? 'true' : 'false'),
        'tags: [' + tags + ']',
        'content_type: html',
        '---',
        '',
        String(body == null ? '' : body)
      ].join('\n');
    }

    function parseYamlScalar(raw) {
      const text = String(raw).trim();
      if (text === '') return '';
      try {
        return JSON.parse(text);
      } catch {
        if (/^'.*'$/.test(text)) return text.slice(1, -1).replace(/''/g, "'");
        if (text === 'true') return true;
        if (text === 'false') return false;
        return text;
      }
    }

    function parseYamlTags(rawValue, followingLines) {
      const value = String(rawValue).trim();
      if (value.charAt(0) === '[') {
        try {
          const parsed = JSON.parse(value);
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          const end = value.lastIndexOf(']');
          return value.slice(1, end === -1 ? value.length : end)
            .split(',').map(item => String(parseYamlScalar(item))).filter(Boolean);
        }
      }
      if (value) return value.split(',').map(item => String(parseYamlScalar(item))).filter(Boolean);
      const result = [];
      for (const line of followingLines) {
        const match = /^\s*-\s+(.*)$/.exec(line);
        if (!match) break;
        result.push(String(parseYamlScalar(match[1])));
      }
      return result;
    }

    function parseNoteText(text) {
      const raw = String(text == null ? '' : text);
      const src = raw.charCodeAt(0) === 0xFEFF ? raw.slice(1) : raw;

      const v2 = /^---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/.exec(src);
      if (v2 && /^keepflow:/m.test(v2[1])) {
        const lines = v2[1].split(/\r?\n/);
        const meta = {};
        lines.forEach((line, index) => {
          const match = /^([A-Za-z_][\w-]*):[ \t]*(.*)$/.exec(line);
          if (!match) return;
          if (match[1] === 'tags') meta.tags = parseYamlTags(match[2], lines.slice(index + 1));
          else meta[match[1]] = parseYamlScalar(match[2]);
        });
        return {
          format: 'v2',
          meta: {
            title: typeof meta.title === 'string' ? meta.title : '',
            createdAt: typeof meta.created === 'string' ? meta.created : '',
            isPinned: meta.pinned === true || meta.pinned === 'true',
            isArchived: meta.archived === true || meta.archived === 'true',
            tags: (Array.isArray(meta.tags) ? meta.tags : []).filter(tag => typeof tag === 'string')
          },
          body: src.slice(v2[0].length).replace(/^\r?\n/, '')
        };
      }

      if (src.indexOf('---JSON---') === 0) {
        const parts = src.split('---JSON---');
        if (parts.length >= 3) {
          try {
            const legacy = JSON.parse(parts[1].trim()) || {};
            return {
              format: 'v1',
              meta: {
                title: '',
                createdAt: typeof legacy.createdAt === 'string' ? legacy.createdAt : '',
                isPinned: normalizeBooleanFlag(legacy.isPinned),
                isArchived: normalizeBooleanFlag(legacy.isArchived),
                tags: (Array.isArray(legacy.tags) ? legacy.tags : []).filter(tag => typeof tag === 'string')
              },
              body: parts.slice(2).join('---JSON---').replace(/^\s+/, '')
            };
          } catch {
            // Malformed metadata: keep the whole text instead of dropping the note.
          }
        }
      }
      return { format: 'plain', meta: { title: '', createdAt: '', isPinned: false, isArchived: false, tags: [] }, body: src };
    }

    // Files from other tools may be plain text/Markdown. The editor stores a
    // small HTML subset, so wrap plain lines in paragraphs instead of letting
    // the browser collapse every line break.
    function looksLikeHtml(text) {
      return /<\/?(?:p|div|br|hr|ul|ol|li|h[1-6]|strong|b|em|i|u|s|strike|a|blockquote|input|span)\b[^>]*>/i.test(text);
    }

    function plainTextToHtml(text) {
      return String(text || '').replace(/\r\n?/g, '\n').split('\n')
        .map(line => line.trim() ? '<p>' + escapeHTML(line) + '</p>' : '<p><br></p>')
        .join('');
    }

    function safeBackupSegment(value, fallback) {
      const cleaned = String(value || '')
        .replace(/[\/\\?%*:|"<>]/g, '-')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/[. ]+$/g, '')
        .slice(0, 180);
      return cleaned || fallback;
    }

    function makeBackupNoteFile(note) {
      return serializeNoteFile({
        title: String(note.title || ''),
        createdAt: note.createdAt || new Date().toISOString(),
        isPinned: normalizeBooleanFlag(note.isPinned),
        isArchived: normalizeBooleanFlag(note.isArchived),
        tags: Array.isArray(note.tags) ? note.tags : []
      }, String(note.content || ''));
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function ensureBackupReady() {
      if (!navigator.onLine) throw new Error('Backup dan restore memerlukan koneksi internet.');
      if (typeof JSZip === 'undefined') throw new Error('Library ZIP belum termuat. Muat ulang aplikasi dan coba lagi.');
      if (syncRunning || cloudLoadInProgress || pendingOperations.length > 0 || pendingCategoryCreates.length > 0) {
        throw new Error('Masih ada proses sinkronisasi atau antrean tertunda. Tunggu sampai status tersinkron, lalu coba lagi.');
      }
      if (hasUnsavedEditorChanges()) throw new Error('Simpan atau batalkan draft editor terlebih dahulu sebelum backup/restore.');
      if (!serverReady) throw new Error('Data cloud belum siap. Tunggu proses pemuatan selesai.');
    }


    // Shared visual progress UI for long-running backup and restore tasks.
    function showDataProgress(title, stage, detail, percent, indeterminate) {
      const overlay = document.getElementById('data-progress-overlay');
      overlay.classList.remove('hidden');
      overlay.classList.add('is-open');
      document.getElementById('data-progress-title').textContent = title;
      document.getElementById('data-progress-close').classList.add('hidden');
      updateDataProgress(stage, detail, percent, indeterminate);
    }

    function updateDataProgress(stage, detail, percent, indeterminate) {
      const fill = document.getElementById('data-progress-fill');
      const track = document.getElementById('data-progress-track');
      const safePercent = Math.max(0, Math.min(100, Number(percent) || 0));
      document.getElementById('data-progress-stage').textContent = stage || '';
      document.getElementById('data-progress-detail').textContent = detail || '';
      document.getElementById('data-progress-percent').textContent = indeterminate ? '…' : Math.round(safePercent) + '%';
      track.setAttribute('aria-valuenow', String(Math.round(safePercent)));
      fill.classList.toggle('is-indeterminate', Boolean(indeterminate));
      if (!indeterminate) fill.style.width = safePercent + '%';
    }

    function finishDataProgress(stage, detail, isError) {
      const fill = document.getElementById('data-progress-fill');
      fill.classList.remove('is-indeterminate');
      fill.style.width = isError ? fill.style.width : '100%';
      updateDataProgress(stage, detail, isError ? Number(document.getElementById('data-progress-track').getAttribute('aria-valuenow')) : 100, false);
      const icon = document.getElementById('data-progress-icon');
      icon.innerHTML = isError
        ? '<i class="fa-solid fa-triangle-exclamation text-lg"></i>'
        : '<i class="fa-solid fa-circle-check text-lg"></i>';
      icon.className = isError
        ? 'h-10 w-10 rounded-xl bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-300 flex items-center justify-center shrink-0'
        : 'h-10 w-10 rounded-xl bg-green-50 dark:bg-green-900/30 text-green-600 dark:text-green-300 flex items-center justify-center shrink-0';
      document.getElementById('data-progress-close').classList.remove('hidden');
    }

    function hideDataProgress() {
      const overlay = document.getElementById('data-progress-overlay');
      overlay.classList.add('hidden');
      overlay.classList.remove('is-open');
      document.getElementById('data-progress-fill').classList.remove('is-indeterminate');
      document.getElementById('data-progress-fill').style.width = '0%';
      document.getElementById('data-progress-icon').innerHTML = '<i class="fa-solid fa-cloud-arrow-down text-lg"></i>';
      document.getElementById('data-progress-icon').className = 'h-10 w-10 rounded-xl bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-300 flex items-center justify-center shrink-0';
    }

    function yieldToBrowser() {
      return new Promise(resolve => requestAnimationFrame(() => resolve()));
    }

    document.getElementById('data-progress-close').addEventListener('click', hideDataProgress);

    async function createKeepFlowBackup() {
      const button = document.getElementById('backup-zip-btn');
      try {
        ensureBackupReady();
        button.disabled = true;
        button.classList.add('opacity-50');
        showDataProgress('Membuat Backup ZIP', 'Mengambil data dari Google Drive', 'Mengambil snapshot catatan dan kategori...', 3, true);
        setSyncStatus('Menyiapkan backup ZIP...', 'fa-circle-notch fa-spin', 'text-blue-500');

        // Fetch an authoritative, atomic cloud snapshot.
        const snapshot = await callKeepFlowServer('getBackupSnapshot');
        if (!snapshot || !Array.isArray(snapshot.notes) || !Array.isArray(snapshot.categories)) {
          throw new Error('Respons snapshot cloud tidak valid.');
        }
        const cloudNotes = snapshot.notes;
        const cloudCategories = snapshot.categories;
        updateDataProgress('Menyiapkan arsip', cloudNotes.length + ' catatan ditemukan.', 12, false);
        await yieldToBrowser();

        const zip = new JSZip();
        const manifest = {
          format: KEEPFLOW_BACKUP_FORMAT,
          schemaVersion: KEEPFLOW_BACKUP_SCHEMA,
          application: 'Hadi KeepFlow',
          applicationVersion: '1.3.8',
          createdAt: snapshot.generatedAt || new Date().toISOString(),
          noteCount: cloudNotes.length,
          categories: [...new Set(cloudCategories.filter(category => String(category).toLocaleLowerCase() !== 'umum'))],
          notes: []
        };

        const usedArchivePaths = new Set();
        for (let index = 0; index < cloudNotes.length; index++) {
          const note = cloudNotes[index];
          const category = normalizeNoteCategory(note.category);
          const archiveCategory = category ? safeBackupSegment(category, 'Kategori') : '';
          const originalTitle = String(note.title || '');
          const backupTitle = originalTitle || ('Catatan ' + (index + 1));
          const filenameTitle = safeBackupSegment(backupTitle, 'Catatan Tanpa Judul');
          const baseFilename = filenameTitle + '.md';
          let filename = baseFilename;
          let suffix = 2;
          let path = archiveCategory ? archiveCategory + '/' + filename : filename;
          while (usedArchivePaths.has(path.toLocaleLowerCase())) {
            filename = filenameTitle + ' (' + suffix + ').md';
            path = archiveCategory ? archiveCategory + '/' + filename : filename;
            suffix++;
          }
          usedArchivePaths.add(path.toLocaleLowerCase());
          zip.file(path, makeBackupNoteFile(note));
          manifest.notes.push({
            path,
            category,
            title: originalTitle || backupTitle,
            originalId: note.id == null ? '' : String(note.id),
            updatedAt: note.updatedAt || ''
          });

          const percent = cloudNotes.length ? 12 + ((index + 1) / cloudNotes.length) * 48 : 60;
          updateDataProgress('Mengumpulkan catatan', 'Menambahkan catatan ' + (index + 1) + ' dari ' + cloudNotes.length, percent, false);
          if (index % 20 === 0) await yieldToBrowser();
        }

        manifest.categories.forEach(category => { if (category && category.toLocaleLowerCase() !== 'umum') zip.folder(safeBackupSegment(category, 'Kategori')); });
        zip.file('manifest.json', JSON.stringify(manifest, null, 2));
        updateDataProgress('Mengompres arsip ZIP', 'Menyiapkan file untuk diunduh...', 62, false);
        await yieldToBrowser();

        const blob = await zip.generateAsync({
          type: 'blob',
          compression: 'DEFLATE',
          compressionOptions: { level: 6 }
        }, metadata => {
          updateDataProgress(
            'Mengompres arsip ZIP',
            'Proses kompresi ' + Math.round(metadata.percent) + '%',
            62 + (metadata.percent * 0.36),
            false
          );
        });

        downloadBlob(blob, 'hadi_keepflow_backup_' + new Date().toISOString().slice(0, 10) + '.zip');
        finishDataProgress('Backup selesai', cloudNotes.length + ' catatan dan ' + manifest.categories.length + ' kategori berhasil di-backup.', false);
        setSyncStatus('Backup ZIP berhasil dibuat', 'fa-cloud-arrow-down', 'text-green-500');
        await new Promise(resolve => setTimeout(resolve, 900));
        hideDataProgress();
        notify('Backup selesai. ' + cloudNotes.length + ' catatan dan ' + manifest.categories.length + ' kategori disimpan ke ZIP.');
      } catch (error) {
        console.error('KeepFlow backup error:', error);
        finishDataProgress('Backup gagal', error.message, true);
        setSyncStatus('Backup gagal', 'fa-triangle-exclamation', 'text-red-500');
        notify('Backup gagal: ' + error.message);
        hideDataProgress();
      } finally {
        button.disabled = false;
        button.classList.remove('opacity-50');
      }
    }

    function parseBackupNoteFile(rawText, path, manifestNote) {
      const parsed = parseNoteText(rawText);
      const meta = parsed.meta;
      const segments = path.split('/').filter(Boolean);
      const categoryFromPath = segments.length > 1 ? segments[segments.length - 2] : '';
      const pathCategory = categoryFromPath.toLocaleLowerCase() === 'umum' ? '' : categoryFromPath;
      const category = normalizeNoteCategory(manifestNote && manifestNote.category != null ? manifestNote.category : pathCategory);
      const filename = segments[segments.length - 1] || '';
      const title = String(manifestNote && manifestNote.title || meta.title || filename.replace(/\.(md|txt)$/i, '')).trim();
      if (!title || title.length > 180 || category.length > 120 || parsed.body.length > MAX_IMPORT_NOTE_BYTES) {
        throw new Error('Judul, kategori, atau isi catatan tidak memenuhi batas ukuran pada ' + path);
      }
      // Content from a ZIP is untrusted: reduce it to the editor's HTML subset
      // before it can reach Drive or be rendered.
      const content = looksLikeHtml(parsed.body) ? sanitizeEditorHTML(parsed.body) : plainTextToHtml(parsed.body);
      if (content.length > MAX_IMPORT_NOTE_BYTES) {
        throw new Error('Isi catatan melebihi batas ukuran setelah dibersihkan pada ' + path);
      }
      const tags = meta.tags.filter(tag => tag.length <= 60).slice(0, 50);
      const created = meta.createdAt && !isNaN(Date.parse(meta.createdAt)) ? meta.createdAt : new Date().toISOString();
      return {
        id: 'import_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10),
        title,
        content,
        category: category,
        isPinned: meta.isPinned,
        isArchived: meta.isArchived,
        tags,
        createdAt: created
      };
    }

    function importDuplicateKey(note) {
      return (normalizeNoteCategory(note.category).toLocaleLowerCase() + '\u0000' +
        String(note.title || '').trim().toLocaleLowerCase());
    }

    function importContentSignature(note) {
      return String(note.content || '');
    }

    async function inspectKeepFlowZip(file) {
      if (!file || !/\.zip$/i.test(file.name)) throw new Error('Pilih file ZIP KeepFlow.');
      if (file.size > MAX_IMPORT_ZIP_BYTES) throw new Error('Ukuran ZIP melebihi batas 25 MB.');
      updateDataProgress('Membaca arsip ZIP', 'Membuka dan memeriksa struktur arsip...', 8, true);
      const zip = await JSZip.loadAsync(file, { checkCRC32: true });
      const entries = Object.values(zip.files).filter(entry => !entry.dir && /\.(md|txt)$/i.test(entry.name));
      if (entries.length > MAX_IMPORT_ENTRIES) throw new Error('ZIP berisi terlalu banyak file (maksimal 2.000 catatan).');
      // Reject oversized expanded entries before decompressing them into browser memory.
      let declaredExpandedBytes = 0;
      for (const entry of entries) {
        const expandedSize = entry._data && Number(entry._data.uncompressedSize);
        if (!Number.isFinite(expandedSize) || expandedSize < 0 || expandedSize > MAX_IMPORT_NOTE_BYTES + 20000) {
          throw new Error('Ukuran file di dalam ZIP tidak valid atau terlalu besar: ' + entry.name);
        }
        declaredExpandedBytes += expandedSize;
        if (declaredExpandedBytes > MAX_IMPORT_ZIP_BYTES) {
          throw new Error('Total ukuran hasil ekstraksi ZIP melebihi 25 MB.');
        }
      }

      let manifest = null;
      if (zip.file('manifest.json')) {
        try {
          manifest = JSON.parse(await zip.file('manifest.json').async('string'));
          if (manifest.format !== KEEPFLOW_BACKUP_FORMAT || !KEEPFLOW_BACKUP_SUPPORTED_SCHEMAS.includes(manifest.schemaVersion)) {
            throw new Error('Versi format backup tidak didukung.');
          }
        } catch (error) {
          throw new Error('Manifest backup tidak valid: ' + error.message);
        }
      }

      const imported = [];
      const invalid = [];
      const manifestNotesByPath = new Map();
      if (manifest && Array.isArray(manifest.notes)) {
        manifest.notes.forEach(item => {
          if (item && typeof item.path === 'string') manifestNotesByPath.set(item.path, item);
        });
      }
      let totalBytes = 0;
      let processedDeclaredBytes = 0;
      const totalDeclaredBytes = Math.max(1, declaredExpandedBytes);
      for (let entryIndex = 0; entryIndex < entries.length; entryIndex++) {
        const entry = entries[entryIndex];
        const entrySize = Number(entry._data.uncompressedSize) || 0;
        try {
          if (entry.name.startsWith('/') || entry.name.includes('\\') || /^[A-Za-z]:/.test(entry.name)) {
            throw new Error('Path file tidak aman.');
          }
          const segments = entry.name.split('/').filter(Boolean);
          if (segments.length < 1 || segments.length > 2 || segments.some(part => part === '.' || part === '..')) {
            throw new Error('Struktur folder tidak didukung.');
          }
          const raw = await entry.async('string', metadata => {
            const withinEntry = entrySize * ((metadata && Number(metadata.percent)) || 0) / 100;
            const overall = (processedDeclaredBytes + withinEntry) / totalDeclaredBytes;
            updateDataProgress(
              'Membaca catatan dari ZIP',
              'Memeriksa file ' + (entryIndex + 1) + ' dari ' + entries.length,
              10 + (overall * 24),
              false
            );
          });
          totalBytes += new Blob([raw]).size;
          if (totalBytes > MAX_IMPORT_ZIP_BYTES) throw new Error('Total data hasil ekstraksi melebihi 25 MB.');
          imported.push(parseBackupNoteFile(raw, entry.name, manifestNotesByPath.get(entry.name) || null));
        } catch (error) {
          invalid.push({ path: entry.name, message: error.message });
        }
        processedDeclaredBytes += entrySize;
        if (entryIndex % 15 === 0) await yieldToBrowser();
      }
      updateDataProgress('Menganalisis isi arsip', 'Mendeteksi duplikasi dan konflik...', 35, false);
      await yieldToBrowser();

      const importedCategories = new Set();
      if (manifest && Array.isArray(manifest.categories)) {
        manifest.categories.forEach(name => {
          if (typeof name === 'string' && name.trim() && name.length <= 120 && name.trim().toLocaleLowerCase() !== 'umum') importedCategories.add(name.trim());
        });
        if (importedCategories.size > 500) throw new Error('Backup mencantumkan terlalu banyak kategori (maksimal 500).');
      }
      imported.forEach(note => { if (note.category) importedCategories.add(note.category); });


      const currentByKey = new Map();
      notes.forEach(note => {
        const key = importDuplicateKey(note);
        if (!currentByKey.has(key)) currentByKey.set(key, []);
        currentByKey.get(key).push(note);
      });

      const newNotes = [];
      let exactDuplicates = 0;
      let titleConflicts = 0;
      imported.forEach(note => {
        const matches = currentByKey.get(importDuplicateKey(note)) || [];
        if (!matches.length) {
          newNotes.push(note);
          currentByKey.set(importDuplicateKey(note), [note]);
          return;
        }
        if (matches.some(existing => importContentSignature(existing) === importContentSignature(note))) {
          exactDuplicates++;
        } else {
          titleConflicts++;
        }
      });

      return {
        notes: newNotes,
        categories: [...importedCategories],
        exactDuplicates,
        titleConflicts,
        invalid,
        sourceNoteCount: entries.length,
        manifest
      };
    }

    async function saveImportedNote(note, index) {
      const result = await callKeepFlowServer('saveNote', note, 'zip-import-' + Date.now() + '-' + index + '-' + Math.random().toString(36).slice(2, 8));
      if (!result || result.status !== 'success' || !result.note) {
        throw new Error((result && result.message) || 'Server tidak mengonfirmasi penyimpanan catatan.');
      }
      return result.note;
    }

    async function restoreKeepFlowZip(file) {
      const input = document.getElementById('restore-zip-file');
      input.disabled = true;
      try {
        ensureBackupReady();
        showDataProgress('Restore / Import ZIP', 'Memeriksa arsip', 'Membaca file ZIP dan memvalidasi isinya...', 5, true);
        setSyncStatus('Memeriksa arsip ZIP...', 'fa-circle-notch fa-spin', 'text-blue-500');
        const preview = await inspectKeepFlowZip(file);
        const invalidCount = preview.invalid.length;
        const summary = [
          'Ringkasan restore/import:',
          '• Catatan dalam ZIP: ' + preview.sourceNoteCount,
          '• Catatan baru: ' + preview.notes.length,
          '• Duplikat identik (akan dilewati): ' + preview.exactDuplicates,
          '• Judul sama, isi berbeda (akan dilewati): ' + preview.titleConflicts,
          '• File tidak valid (akan dilewati): ' + invalidCount,
          '• Kategori: ' + preview.categories.length,
          '',
          'Data yang sudah ada tidak akan dihapus atau ditimpa.',
          'Lanjutkan?'
        ].join('\n');
        updateDataProgress('Preview siap', preview.notes.length + ' catatan baru siap dipulihkan.', 36, false);
        await yieldToBrowser();
        if (!confirm(summary)) {
          setSyncStatus('Restore dibatalkan', 'fa-cloud', 'text-gray-400');
          hideDataProgress();
          return;
        }

        let categoriesCreated = 0;
        const categoriesToCreate = preview.categories.filter(category => category && category.toLocaleLowerCase() !== 'umum');
        for (let i = 0; i < categoriesToCreate.length; i++) {
          const category = categoriesToCreate[i];
          updateDataProgress(
            'Menyiapkan kategori',
            'Memproses kategori ' + (i + 1) + ' dari ' + categoriesToCreate.length + ': ' + category,
            categoriesToCreate.length ? 36 + ((i + 1) / categoriesToCreate.length) * 9 : 45,
            false
          );
          const response = await callKeepFlowServer('createCategoryFolder', category);
          if (!response || response.status !== 'success') {
            throw new Error((response && response.message) || ('Gagal membuat kategori ' + category));
          }
          categoriesCreated++;
        }

        let saved = 0;
        const importedNotes = [];
        for (let i = 0; i < preview.notes.length; i++) {
          updateDataProgress(
            'Memulihkan catatan',
            'Menyimpan catatan ' + (i + 1) + ' dari ' + preview.notes.length + ': ' + preview.notes[i].title,
            preview.notes.length ? 45 + ((i + 1) / preview.notes.length) * 52 : 97,
            false
          );
          setSyncStatus('Memulihkan catatan ' + (i + 1) + ' dari ' + preview.notes.length + '...', 'fa-circle-notch fa-spin', 'text-blue-500');
          const savedNote = await saveImportedNote(preview.notes[i], i);
          importedNotes.push(savedNote);
          saved++;
        }

        updateDataProgress('Memperbarui daftar catatan', 'Memperbarui cache lokal dan kategori...', 98, false);
        // Merge into local state only after each cloud write has been acknowledged.
        const byId = new Map(notes.map(note => [String(note.id), note]));
        importedNotes.forEach(note => byId.set(String(note.id), note));
        notes = [...byId.values()];
        lastObservedNotes = cloneData(notes);
        persistLocal();
        reconcileCloudCategories(await callKeepFlowServer('getCategories'));
        render();
        finishDataProgress('Restore selesai', saved + ' catatan berhasil dipulihkan. Data lama tetap aman.', false);
        setSyncStatus('Restore selesai', 'fa-cloud-arrow-up', 'text-green-500');
        await new Promise(resolve => setTimeout(resolve, 900));
        hideDataProgress();
        notify(
          'Restore selesai.\n' +
          'Catatan ditambahkan: ' + saved + '\n' +
          'Duplikat dilewati: ' + preview.exactDuplicates + '\n' +
          'Konflik judul dilewati: ' + preview.titleConflicts + '\n' +
          'File tidak valid dilewati: ' + invalidCount + '\n' +
          'Kategori diperiksa/dibuat: ' + categoriesCreated + '\n\n' +
          'Catatan yang sudah ada tidak dihapus atau ditimpa.'
        );
      } catch (error) {
        console.error('KeepFlow restore error:', error);
        finishDataProgress('Restore gagal / terhenti', error.message, true);
        setSyncStatus('Restore berhenti - periksa data cloud', 'fa-triangle-exclamation', 'text-red-500');
        notify('Restore tidak selesai: ' + error.message + '\n\nCatatan yang sudah berhasil disimpan tetap berada di Google Drive. Jalankan restore lagi untuk melanjutkan; duplikat akan dilewati.');
        hideDataProgress();
        // Refresh cloud state after a partial restore so the UI reflects acknowledged writes.
        try { loadInitialData(); } catch (refreshError) { console.warn(refreshError); }
      } finally {
        input.disabled = false;
        input.value = '';
      }
    }

          event.preventDefault();

          return;
        }
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && (document.activeElement === first || !editorModal.contains(document.activeElement))) {
          event.preventDefault();
          last.focus();
          return;
        }
        if (!event.shiftKey && (document.activeElement === last || !editorModal.contains(document.activeElement))) {
          event.preventDefault();
          first.focus();
          return;
        }
      }
      if (event.key === 'Escape' && mobileActionsMenu && !mobileActionsMenu.classList.contains('hidden')) {
        event.preventDefault();
        closeMobileActionsMenu(true);
        return;
      }
      if (event.key === 'Escape') {

        return;
      }
      const modifier = event.ctrlKey || event.metaKey;
      if (!modifier) return;
      const key = event.key.toLowerCase();

        event.preventDefault();
        saveActiveNote();

        event.preventDefault();
        insertEditorLink();

        event.preventDefault();

      if (!window.matchMedia('(max-width: 1023px)').matches) {
        setSidebarBodyLock(false);
        sidebar.classList.remove('sidebar-open');
        sidebarBackdrop.classList.remove('sidebar-backdrop-open');
        sidebar.setAttribute('aria-hidden', String(sidebar.classList.contains('sidebar-collapsed')));
        sidebarBackdrop.setAttribute('aria-hidden', 'true');
        sidebarToggle.setAttribute('aria-expanded', String(!sidebar.classList.contains('sidebar-collapsed')));
        sidebarToggle.setAttribute('aria-label', sidebar.classList.contains('sidebar-collapsed') ? 'Tampilkan navigasi' : 'Sembunyikan navigasi');
      } else {
        sidebar.classList.remove('sidebar-collapsed');
        sidebar.setAttribute('aria-hidden', String(!sidebar.classList.contains('sidebar-open')));
        sidebarToggle.setAttribute('aria-expanded', String(sidebar.classList.contains('sidebar-open')));
        sidebarToggle.setAttribute('aria-label', sidebar.classList.contains('sidebar-open') ? 'Tutup navigasi' : 'Buka navigasi');
      }
    });

    document.getElementById('retry-sync').addEventListener('click', () => {
      if (!pendingOperations.length) return;
      const head = pendingOperations[0];
      head.attempts = 0;
      head.nextAttemptAt = '';
      head.lastError = '';
      persistLocal();
      showManualRetry(false);
      if (serverReady) flushPendingOperations();
      else loadInitialData();
    });

    window.addEventListener('online', () => {
      // Refresh the cloud baseline on every reconnect before replaying queued
      // writes. This catches changes made from another tab/device.
      clearRetryTimer();
      loadInitialData();
    });

    window.addEventListener('pagehide', () => { NotesCache.flushNow(); });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') {
        flushEditorDraftNow();
        NotesCache.flushNow();
        return;
      }
      // Recover timers that may have been throttled while the tab was hidden.
      if (pendingOperations.length && serverReady && !syncRunning) {
        schedulePendingRetry();
      }
    });

    window.addEventListener('pageshow', () => {
      // Queue and note snapshots are persisted continuously; resume safely.
      if (pendingOperations.length && navigator.onLine) loadInitialData();
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadUserPreferences();
      loadSearchHistory();
      renderRecentSearches();
      loadInitialData();
    });
  </script>
