name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Tanpa dependensi: memakai test runner bawaan Node.
      - name: Jalankan tes (sintaks, kontrak klien-server, format catatan, backend)
        run: node --test tests/*.test.js
