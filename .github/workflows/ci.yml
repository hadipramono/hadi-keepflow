name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Satu-satunya dependensi dev: fake-indexeddb (untuk tes cache lokal).
      - run: npm ci
      - name: Tes (sintaks, kontrak klien-server, format catatan, backend, indeks, delta, cache lokal)
        run: npm test
