<!-- Shared application styles. Included by Index.html. -->
  <style>
    .dashboard-stat {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 1rem; padding: 1rem; min-width: 0;
    }
    .dark .dashboard-stat { background: #1f2937; border-color: #374151; }
    .dashboard-stat-icon { width: 2.25rem; height: 2.25rem; border-radius: .75rem; display: flex; align-items: center; justify-content: center; margin-bottom: .75rem; }
    .dashboard-stat-label { color: #6b7280; font-size: .72rem; line-height: 1.2; }
    .dark .dashboard-stat-label { color: #9ca3af; }
    .dashboard-stat-value { color: #111827; font-size: 1.65rem; font-weight: 700; line-height: 1.2; margin-top: .25rem; }
    .dark .dashboard-stat-value { color: #f9fafb; }
    .dashboard-panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 1rem; padding: 1rem; min-width: 0; }
    .dark .dashboard-panel { background: #1f2937; border-color: #374151; }
    @media (min-width: 640px) { .dashboard-stat { padding: 1.15rem; } .dashboard-panel { padding: 1.25rem; } }

    .view-grid {
      column-count: 1;
      column-gap: 1rem;
    }
    @media (min-width: 640px) { .view-grid { column-count: 2; } }
    @media (min-width: 1024px) { .view-grid { column-count: 3; } }
    @media (min-width: 1280px) { .view-grid { column-count: 4; } }
    
    .view-grid .masonry-item {
      break-inside: avoid;
      margin-bottom: 1rem;
    }

    .view-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-width: 100%;
    }
    .view-list .masonry-item {
      margin-bottom: 0;
      width: 100%;
      padding: 0.75rem 1rem !important;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: rgba(156, 163, 175, 0.5);
      border-radius: 3px;
    }
    [contenteditable]:empty:before {
      content: attr(placeholder);
      color: #9ca3af;
      pointer-events: none;
      display: block;
    }
    .toolbar-btn.active {
      background-color: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
    }
    .toolbar-btn:focus-visible {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
    }
    /* Editor layout: keep long content in the scrollable modal body, not over metrics/tags. */
    #editor-modal > .editor-modal-body { min-height: 0; }
    #editor-content-editable {
      display: block;
      flex: 0 0 auto;
      height: auto;
      min-height: max(45vh, 250px);
      overflow: visible;
      overflow-wrap: anywhere;
    }
    #editor-metrics,
    #modal-tags-input { flex-shrink: 0; }
    .editor-content { line-height: 1.75; overflow-wrap: anywhere; }
    .editor-content h1 { font-size: 1.65em; line-height: 1.25; font-weight: 700; margin: .8em 0 .45em; }
    .editor-content h2 { font-size: 1.3em; line-height: 1.35; font-weight: 650; margin: .75em 0 .4em; }
    .editor-content p { margin: .35em 0; }
    .editor-content ul, .editor-content ol { padding-left: 1.6rem; margin: .5em 0; }
    .editor-content ul { list-style: disc; }
    .editor-content ol { list-style: decimal; }
    .editor-content blockquote { border-left: 3px solid #60a5fa; padding-left: 1rem; margin: .75em 0; color: #64748b; }
    .dark .editor-content blockquote { color: #cbd5e1; }
    .editor-content a { color: #2563eb; text-decoration: underline; }
    .dark .editor-content a { color: #93c5fd; }
    .editor-content hr { border: 0; border-top: 1px solid #cbd5e1; margin: 1.25em 0; }
    .editor-content ul.keepflow-checklist { list-style: none; padding-left: .25rem; }
    .editor-content ul.keepflow-checklist li { display: flex; align-items: flex-start; gap: .55rem; margin: .35rem 0; }
    .editor-content input[type="checkbox"] { width: 1rem; height: 1rem; flex: 0 0 auto; margin-top: .35em; accent-color: #2563eb; cursor: pointer; }
    .editor-content input[type="checkbox"]:checked + span { color: #9ca3af; text-decoration: line-through; }
    .dark .editor-content input[type="checkbox"]:checked + span { color: #6b7280; }
    .dark .toolbar-btn.active {
      background-color: rgba(59, 130, 246, 0.3);
      color: #60a5fa;
    }
    .sidebar-backdrop { display: none; }
    .mobile-drawer-heading { display: none; }
    #toggle-sidebar, #close-sidebar { min-width: 44px; min-height: 44px; }
    #toggle-sidebar:focus-visible, #close-sidebar:focus-visible, #sidebar button:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }
    @media (max-width: 1023px) {
      #sidebar { position: fixed; top: calc(4rem + 2.25rem + env(safe-area-inset-top, 0px)); bottom: 0; left: 0; z-index: 35; width: min(20rem, 88vw); height: calc(100vh - 6.25rem - env(safe-area-inset-top, 0px)); height: calc(100dvh - 6.25rem - env(safe-area-inset-top, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); transform: translateX(-105%); box-shadow: 0 12px 32px rgba(0,0,0,.18); overscroll-behavior: contain; transition: transform 200ms ease; }
      #sidebar.sidebar-open { transform: translateX(0); }
      #sidebar.sidebar-open { visibility: visible; }
      #sidebar:not(.sidebar-open) { visibility: hidden; transition: transform 200ms ease, visibility 0s linear 200ms; }
      #sidebar.sidebar-open { transition: transform 200ms ease; }
      .mobile-drawer-heading { display: flex; }
      .sidebar-backdrop.sidebar-backdrop-open { display: block; }
      #sidebar-backdrop { top: calc(4rem + 2.25rem + env(safe-area-inset-top, 0px)); }
      #app > header { height: auto; min-height: 4rem; padding-top: env(safe-area-inset-top, 0px); }
      #app { height: 100vh; height: 100dvh; }
      #search-input { font-size: 16px; }
      #date-filter-toggle, #toggle-view-mode, #open-settings-btn, #toggle-theme { min-width: 44px; min-height: 44px; justify-content: center; }
    }
    @media (min-width: 1024px) {
      #sidebar.sidebar-collapsed { display: none; }
    }
    @media (max-width: 420px) {
      #app > header { gap: .25rem; }
      #app > header > div:first-child { gap: .25rem; }
      #app > header > div:last-child { gap: 0; }
      #app > header > div:last-child > button { min-width: 44px; padding-left: .4rem; padding-right: .4rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      #sidebar, .sidebar-backdrop { transition-duration: 0.01ms !important; }
    }
    .action-btn.active {
      background-color: rgba(59, 130, 246, 0.15) !important;
      color: #3b82f6 !important;
    }
    .dark .action-btn.active {
      background-color: rgba(59, 130, 246, 0.3) !important;
      color: #60a5fa !important;
    }

    #data-progress-overlay.is-open { display: flex; }
    #data-progress-fill.is-indeterminate {
      width: 35% !important;
      animation: keepflow-progress-slide 1.2s ease-in-out infinite;
    }
    @keyframes keepflow-progress-slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(310%); }
    }

    .search-highlight {
      background: rgba(250, 204, 21, .35);
      color: inherit;
      border-radius: .2rem;
      padding: 0 .05rem;
    }
    .dark .search-highlight {
      background: rgba(234, 179, 8, .28);
      color: #fde68a;
    }
    #recent-search-list button:hover {
      background: rgba(148, 163, 184, .12);
    }
    .note-select-checkbox { cursor: pointer; }
    .note-selected {
      outline: 2px solid rgba(59, 130, 246, .75);
      outline-offset: -2px;
      background-color: rgba(59, 130, 246, .045);
    }
    #bulk-actions-bar button:disabled { opacity: .45; cursor: not-allowed; }


    /* Placeholder for the rich-text template editor. */
    [contenteditable][data-placeholder]:empty::before {
      content: attr(data-placeholder);
      color: #9ca3af;
      pointer-events: none;
    }
  </style>
