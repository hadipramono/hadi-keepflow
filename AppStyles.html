<!-- Shared application styles. Included by Index.html. -->
  <style>
    .view-grid {
      column-count: 1;
      column-gap: 1rem;
    }
    @media (min-width: 640px) { .view-grid { column-count: 2; } }
    @media (min-width: 1024px) { .view-grid { column-count: 3; } }
    @media (min-width: 1280px) { .view-grid { column-count: 4; } }
    
    .view-grid .masonry-item {
      break-inside: avoid;
      margin-bottom: 1rem;
    }

    .view-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-width: 100%;
    }
    .view-list .masonry-item {
      margin-bottom: 0;
      width: 100%;
      padding: 0.75rem 1rem !important;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: rgba(156, 163, 175, 0.5);
      border-radius: 3px;
    }
    [contenteditable]:empty:before {
      content: attr(placeholder);
      color: #9ca3af;
      pointer-events: none;
      display: block;
    }
    .toolbar-btn.active {
      background-color: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
    }
    .dark .toolbar-btn.active {
      background-color: rgba(59, 130, 246, 0.3);
      color: #60a5fa;
    }
    .sidebar-backdrop { display: none; }
    @media (max-width: 1023px) {
      #sidebar { position: fixed; top: 4rem; bottom: 0; left: 0; z-index: 35; width: min(18rem, 86vw); transform: translateX(-105%); box-shadow: 0 12px 32px rgba(0,0,0,.18); }
      #sidebar.sidebar-open { transform: translateX(0); }
      .sidebar-backdrop.sidebar-backdrop-open { display: block; }
    }
    @media (min-width: 1024px) {
      #sidebar.sidebar-collapsed { display: none; }
    }
    .action-btn.active {
      background-color: rgba(59, 130, 246, 0.15) !important;
      color: #3b82f6 !important;
    }
    .dark .action-btn.active {
      background-color: rgba(59, 130, 246, 0.3) !important;
      color: #60a5fa !important;
    }

    #data-progress-overlay.is-open { display: flex; }
    #data-progress-fill.is-indeterminate {
      width: 35% !important;
      animation: keepflow-progress-slide 1.2s ease-in-out infinite;
    }
    @keyframes keepflow-progress-slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(310%); }
    }

    .search-highlight {
      background: rgba(250, 204, 21, .35);
      color: inherit;
      border-radius: .2rem;
      padding: 0 .05rem;
    }
    .dark .search-highlight {
      background: rgba(234, 179, 8, .28);
      color: #fde68a;
    }
    #recent-search-list button:hover {
      background: rgba(148, 163, 184, .12);
    }
    .note-select-checkbox { cursor: pointer; }
    .note-selected {
      outline: 2px solid rgba(59, 130, 246, .75);
      outline-offset: -2px;
      background-color: rgba(59, 130, 246, .045);
    }
    #bulk-actions-bar button:disabled { opacity: .45; cursor: not-allowed; }
  </style>
